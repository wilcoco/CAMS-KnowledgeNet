[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nightwish"
version = "0.1.0"
description = "Living-ontology knowledge evaluation & reward system (MVP prototype)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - 대외비 / Confidential" }
authors = [{ name = "Json (홍정수)" }]
keywords = ["ontology", "knowledge", "hub-authority", "tokenomics", "tacit-knowledge"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]
# 서비스(MVS) 레이어에만 필요. 도메인 코어(scoring/tree/economy/verification)는
# 여전히 의존성 0.
service = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",   # Postgres 드라이버 (Railway 배포)
    "anthropic>=0.40",         # 실제 LLM 북키핑 (ANTHROPIC_API_KEY 있을 때)
]

[project.scripts]
nightwish-firstwheel = "nightwish.simulation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nightwish.webapp" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
