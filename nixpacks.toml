# Railway / Nixpacks build for the MVP wiki (nightwish.mvp:app).
#
# We create an explicit venv so `pip` is guaranteed present (the bare nix
# `python311` doesn't put `pip` on PATH). Third-party deps install in the
# (cache-friendly) install phase; the local package installs in the build
# phase, after the full source tree has been copied.

[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = [
  "python3 -m venv --copies /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip setuptools wheel",
  "/opt/venv/bin/pip install fastapi 'uvicorn[standard]' pydantic anthropic",
]

[phases.build]
cmds = ["/opt/venv/bin/pip install --no-deps -e ."]

[start]
cmd = "/opt/venv/bin/python -m uvicorn nightwish.mvp:app --host 0.0.0.0 --port $PORT"
