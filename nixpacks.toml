# Railway / Nixpacks build for the unified app (nightwish.unified:app).
#
# We create an explicit venv so `pip` is guaranteed present (the bare nix
# `python311` doesn't put `pip` on PATH). Third-party deps install in the
# (cache-friendly) install phase; the local package installs in the build
# phase, after the full source tree has been copied.

[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = [
  "python3 -m venv --copies /opt/venv",
  # NOTE: pip 자체 업그레이드(pip/setuptools/wheel)는 *의도적으로 생략*.
  # 베이스 이미지의 pip로 아래 deps(전부 manylinux wheel) 설치에 충분하고,
  # 업그레이드가 끌어오는 최신 빌드툴(packaging 26 등)에서 CDN 해시 불일치로
  # 빌드가 깨진 사례가 있어 실패 지점을 없앤다.
  "/opt/venv/bin/pip install fastapi 'uvicorn[standard]' pydantic anthropic 'psycopg[binary]' google-auth",
]

[phases.build]
cmds = ["/opt/venv/bin/pip install --no-deps -e ."]

[start]
cmd = "/opt/venv/bin/python -m uvicorn nightwish.unified:app --host 0.0.0.0 --port $PORT"
