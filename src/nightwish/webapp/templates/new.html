{% extends "base.html" %}
{% block title %}새 페이지{% endblock %}
{% block body %}
<div class="card">
  <h2>새 페이지</h2>
  <form method="post" action="/wiki">
    <label>제목</label>
    <input type="text" name="title" required placeholder="예: 무도장 하이그로시 사출">
    <label style="display:block; margin-top:.8rem;">본문 (마크다운 · <code>[[다른 문서]]</code>로 링크)</label>
    <textarea name="body" placeholder="# 개요&#10;무도장 사출... 참고: [[금형 온도]]"></textarea>
    <label style="display:block; margin-top:.6rem;">
      <input type="checkbox" name="shared" value="1" style="width:auto"> 바로 공유하기
    </label>
    <div style="margin-top:.8rem;" class="row">
      <button type="submit">만들기</button>
      <a href="/">취소</a>
    </div>
    <p class="muted" style="margin-top:.6rem;">저장하면 LLM 북키핑이 요약과 링크를
      자동으로 추출합니다.</p>
  </form>
</div>
{% endblock %}
