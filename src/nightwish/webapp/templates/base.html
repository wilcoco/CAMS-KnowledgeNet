<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}검증된 소셜 위키{% endblock %} · Nightwish</title>
  <style>
    :root { --fg:#1d2129; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb;
            --ok:#15803d; --bg:#fafafa; --card:#fff; }
    * { box-sizing:border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
           "Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:var(--fg);
           background:var(--bg); margin:0; line-height:1.6; }
    header { background:var(--card); border-bottom:1px solid var(--line);
             padding:.7rem 1rem; display:flex; align-items:center; gap:1rem; }
    header .brand { font-weight:700; text-decoration:none; color:var(--fg); }
    header .spacer { flex:1; }
    .wrap { max-width:880px; margin:1.4rem auto; padding:0 1rem; }
    .card { background:var(--card); border:1px solid var(--line);
            border-radius:10px; padding:1rem 1.2rem; margin-bottom:1rem; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .wikilink.missing { color:#dc2626; }
    .muted { color:var(--muted); font-size:.9rem; }
    .badge { display:inline-block; font-size:.75rem; padding:.1rem .5rem;
             border-radius:999px; background:#dcfce7; color:var(--ok);
             border:1px solid #bbf7d0; }
    .badge.points { background:#eff6ff; color:var(--accent); border-color:#bfdbfe; }
    input,textarea,select,button { font:inherit; }
    input[type=text],input[type=number],textarea,select {
      width:100%; padding:.5rem .6rem; border:1px solid var(--line);
      border-radius:8px; background:#fff; }
    textarea { min-height:9rem; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    button { background:var(--accent); color:#fff; border:0; padding:.5rem .9rem;
             border-radius:8px; cursor:pointer; }
    button.secondary { background:#f3f4f6; color:var(--fg); border:1px solid var(--line); }
    .row { display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; }
    .err { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca;
           padding:.5rem .8rem; border-radius:8px; margin-bottom:1rem; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    h1,h2,h3 { line-height:1.3; }
    li { margin:.1rem 0; }
    form.inline { display:inline; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">🦉 Nightwish<span class="muted"> · 검증된 소셜 위키</span></a>
    <span class="spacer"></span>
    {% if user %}
      <span class="badge points">{{ "%.0f"|format(balance) }} P</span>
      <span class="muted">{{ user.display_name }}</span>
      <a href="/wiki/new">+ 새 페이지</a>
      <form class="inline" method="post" action="/logout">
        <button class="secondary" type="submit">로그아웃</button>
      </form>
    {% else %}
      <form class="row" method="post" action="/login">
        <input type="text" name="name" placeholder="이름으로 시작" style="width:12rem">
        <button type="submit">시작</button>
      </form>
    {% endif %}
  </header>
  <div class="wrap">
    {% block body %}{% endblock %}
  </div>
</body>
</html>
