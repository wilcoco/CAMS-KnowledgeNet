<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>같이 키우는 답 — 묻고, 가려내고, 물려준다</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --fg:#e6e8ee;
          --mut:#9aa3b2; --acc:#7aa2ff; --good:#5ad19a; --warn:#ffcf6b;
          --link:#8ab4ff; --stub:#c98a8a; --fork:#e0a0ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.6 system-ui,"Apple SD Gothic Neo",sans-serif; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex;
           gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  header .stat { color:var(--mut); font-size:12px; }
  header .spacer { flex:1; }
  input, textarea, select { background:#0c0e13; color:var(--fg);
    border:1px solid var(--line); border-radius:6px; padding:7px 9px; font:inherit; }
  .grid { display:grid; grid-template-columns:340px 1fr 270px; gap:0;
          height:calc(100vh - 51px); }
  aside { overflow:auto; padding:12px; }
  aside { border-right:1px solid var(--line); }
  aside.right { border-right:0; border-left:1px solid var(--line); }
  /* CENTER = horizontal stack of sliding panes (Roam/Matuschak식): 링크를 따라가면
     우측으로 새 패널이 쌓여 읽기 흐름이 끊기지 않는다. */
  .center { overflow-x:auto; overflow-y:hidden; padding:0; display:flex; align-items:stretch; }
  .pane { flex:1 1 clamp(340px, 44vw, 560px); max-width:900px; overflow-y:auto; padding:12px 14px;
          border-right:1px solid var(--line); position:relative; }
  .pane.active { box-shadow: inset 3px 0 0 var(--acc); }
  .pane-close { position:absolute; top:8px; right:10px; background:none; color:var(--mut);
                font-size:16px; padding:0 4px; cursor:pointer; }
  .crumbs { font-size:11px; color:var(--mut); margin-bottom:6px; }
  .crumbs a { color:var(--link); cursor:pointer; }
  @media (max-width:880px){ .grid { grid-template-columns:1fr; height:auto; }
    .pane { flex-basis:88vw; }
    /* 사다리 압축(노트 23): 좁은 화면에선 버튼 줄바꿈·배지 축소 — 계단은 유지 */
    .row { flex-wrap:wrap; }
    .badge { font-size:.72em; padding:1px 5px; }
    .item .m { font-size:.78em; } }
  /* LEFT: Windsurf-style tabs (검색 / 위치) */
  .tabs { display:flex; gap:2px; border-bottom:1px solid var(--line);
          margin:-12px -12px 10px; padding:0 8px; }
  .tab { background:none; color:var(--mut); border:0; border-bottom:2px solid transparent;
         border-radius:0; padding:7px 12px; font-weight:600; cursor:pointer; }
  .tab:hover { color:var(--fg); }
  .tab.active { color:var(--acc); border-bottom-color:var(--acc); }
  .tab.ping::after { content:"●"; color:var(--good); font-size:8px; margin-left:5px; vertical-align:2px; }
  /* LEFT: IDE-style knowledge tree explorer (노트 09) */
  #tree { font-size:13px; overflow:auto; margin-bottom:4px;
          border:1px solid var(--line); border-radius:8px; padding:5px 4px; }
  .trow { display:flex; align-items:center; gap:4px; padding:2px 4px; border-radius:5px;
          cursor:pointer; white-space:nowrap; }
  .trow:hover { background:#1a1f29; }
  .trow.cur { background:#1e3a2b; box-shadow:inset 2px 0 0 var(--good); }
  .ttwist { flex:0 0 13px; text-align:center; color:var(--mut); user-select:none; font-size:11px; }
  .tlabel { overflow:hidden; text-overflow:ellipsis; }
  .tkind { font-size:9px; padding:0 4px; border-radius:8px; border:1px solid var(--line);
           color:var(--mut); margin-right:4px; vertical-align:1px; }
  .tkind.comment { color:var(--good); border-color:#2c4; }
  .tkind.fork    { color:var(--fork); border-color:var(--fork); }
  .tkind.followup{ color:var(--link); border-color:var(--link); }
  .tkind.unfold  { color:var(--warn); border-color:var(--warn); }
  /* root concepts = the spine: bold + diamond marker + a little air above */
  .tnode.root > .trow { margin-top:3px; }
  .tnode.root > .trow .tlabel { font-weight:700; }
  .tnode.root > .trow .tlabel::before { content:"◆ "; color:var(--acc); font-weight:400; }
  /* link refs (slug/드래그로 가리킨 개념) = 루트 밑 참조 — 흐리게 + → 표시.
     사람 기여(보강/정정/후속)는 알맹이라 밝게 둔다. */
  .trow.ref .tlabel { color:var(--mut); }
  .trow.ref .tlabel::before { content:"→ "; color:var(--link); }
  /* 시멘틱 릴레이션 칩(노트 16) — 무라벨(관련)은 흐리게, 타입 확인되면 또렷하게 */
  .rel-chip { font-size:10px; border:1px solid var(--line); border-radius:8px;
              padding:0 5px; margin-left:3px; color:var(--mut); cursor:pointer; }
  .rel-chip.set { color:var(--acc); border-color:var(--acc); }
  .rel-pop { position:fixed; z-index:80; background:var(--panel);
             border:1px solid var(--line); border-radius:8px; padding:5px; display:flex; gap:4px; }
  /* each level steps in with its own guide rail */
  .tkids { margin-left:7px; border-left:1px solid var(--line); padding-left:7px; }
  h2.sec { font-size:11px; color:var(--acc); text-transform:uppercase;
           letter-spacing:.5px; margin:16px 0 6px; }
  /* 4겹 섹션(노트 15): 보강/다른답/후속을 종류별로 — 수가 곧 '살아있는 답'의 증거 */
  details.kn-sec { margin-top:10px; }
  details.kn-sec > summary { cursor:pointer; list-style:none; font-size:12px; color:var(--acc);
    padding:5px 0; border-top:1px solid var(--line); }
  details.kn-sec > summary::-webkit-details-marker { display:none; }
  details.kn-sec > summary::before { content:"▸ "; color:var(--mut); }
  details.kn-sec[open] > summary::before { content:"▾ "; }
  .draft-hint { color:var(--warn); margin-top:8px; }
  .actbar.main { border-top:1px solid var(--line); padding-top:10px; margin-top:12px; }
  /* 온보딩(빈 화면 = 내 호기심으로 채우기) */
  .onboard h2 { font-size:17px; margin-bottom:8px; }
  .onboard p { max-width:560px; margin:8px auto; line-height:1.7; }
  /* 금융은 뒤로: '경제(고급)' 접기 헤더(흐리게) */
  details.econ-adv > summary { cursor:pointer; list-style:none; font-size:11px;
    color:var(--mut); text-transform:uppercase; letter-spacing:.5px; margin:16px 0 6px; }
  details.econ-adv > summary::-webkit-details-marker { display:none; }
  details.econ-adv > summary::before { content:"▸ "; }
  details.econ-adv[open] > summary::before { content:"▾ "; }
  button { background:var(--acc); color:#0a0c10; border:0; border-radius:6px;
           padding:7px 11px; font-weight:600; cursor:pointer; }
  button.sec { background:#252a35; color:var(--fg); }
  button.link { background:none; color:var(--link); padding:0; font-weight:400;
                cursor:pointer; border:0; }
  #search { width:100%; }
  .row { display:flex; gap:6px; align-items:center; margin-top:6px; }
  .item { padding:8px 10px; border:1px solid var(--line); border-radius:8px;
          margin:6px 0; cursor:pointer; background:var(--panel); }
  .item:hover { border-color:var(--acc); }
  .item .t { font-weight:600; }
  .item .m { color:var(--mut); font-size:12px; }
  .badge { font-size:11px; padding:1px 6px; border-radius:10px; border:1px solid var(--line);
           color:var(--mut); }
  .badge.frozen { color:var(--warn); border-color:var(--warn); }
  .badge.query { color:var(--good); border-color:var(--good); }
  .badge.co.author { color:var(--acc); border-color:var(--acc); }
  .badge.co.evaluator { color:var(--link); border-color:var(--link); }
  .badge.adopted { color:var(--good); border-color:var(--good); }
  .badge.draft { color:var(--mut); border-color:var(--mut); }
  .answer { white-space:pre-wrap; background:var(--panel); border:1px solid var(--line);
            border-radius:8px; padding:12px; margin:8px 0; }
  /* AI busy indicator */
  @keyframes spin { to { transform:rotate(360deg); } }
  .spinner { display:inline-block; width:13px; height:13px; vertical-align:-2px;
             border:2px solid var(--mut); border-top-color:var(--acc);
             border-radius:50%; animation:spin .8s linear infinite; }
  #busy { position:fixed; top:0; left:0; right:0; z-index:50; display:none;
          gap:8px; align-items:center; justify-content:center; padding:7px 12px;
          background:rgba(122,162,255,.14); border-bottom:1px solid var(--acc);
          color:var(--fg); font-size:13px; }
  #busy.on { display:flex; }
  .inline-busy { color:var(--acc); font-size:12px; }
  button[disabled] { opacity:.55; cursor:progress; }
  /* 본문 드래그 → AI에게 묻고 연결 팝업 (fixed: 패널 내부 스크롤과 무관하게 정확) */
  #sel-pop { position:fixed; display:none; z-index:60; width:280px; padding:8px;
             background:var(--panel); border:1px solid var(--acc); border-radius:8px;
             box-shadow:0 6px 20px rgba(0,0,0,.45); }
  #sel-pop input { width:100%; margin:4px 0; }
  #sel-hint { margin-top:6px; min-height:14px; }
  #sel-exist { margin:2px 0 4px; }
  /* 작업 결과(평가·채우기 등) 토스트 — 패널 재렌더로 사라지지 않게 화면 상단 고정 */
  #toast { position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:70;
           display:none; max-width:80vw; padding:8px 14px; border-radius:8px;
           background:#1d2530; border:1px solid var(--acc); color:var(--fg); font-size:13px;
           box-shadow:0 6px 20px rgba(0,0,0,.45); }
  #toast.on { display:block; }
  .wl-row, .ol { color:var(--link); cursor:pointer; }
  .node-head { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .node-head h3 { margin:0; font-size:18px; }
  .prov { color:var(--mut); font-size:12px; }
  .thread { margin-top:10px; }
  .c { border-left:2px solid var(--line); padding:6px 0 6px 12px; margin:6px 0 6px 4px; }
  .c .who { font-size:12px; }
  .c.fork { border-color:var(--fork); }
  .c .body { white-space:pre-wrap; margin:2px 0; }
  .kind-tag { font-size:11px; color:var(--mut); }
  .actbar { display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
  .actbar button { padding:3px 8px; font-size:12px; font-weight:500; }
  .reply { margin-top:6px; }
  .reply textarea { width:100%; min-height:50px; }
  .empty { color:var(--mut); padding:20px; text-align:center; }
  .sc { display:flex; justify-content:space-between; font-size:13px; padding:2px 0; }
  .sc .v { color:var(--good); }
  /* 내 프로필 — 점유율 카드 */
  .sc.big { font-size:15px; font-weight:700; margin-top:4px; padding:4px; cursor:pointer; border-radius:6px; }
  .sc.big .v { color:var(--acc); }
  .sc.big:hover, .cat-row:hover { background:#1a1f29; }
  .cat-row { cursor:pointer; padding:2px 4px; border-radius:5px; }
  .cat-row .cat-t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:150px; }
  .cat-detail { padding:2px 0 6px 10px; border-left:1px solid var(--line); margin:0 0 4px 5px; }
  .me-node { color:var(--link); cursor:pointer; display:block; padding:1px 0;
             overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  a.wl { color:var(--link); cursor:pointer; }
  a.ext { color:var(--link); text-decoration:underline; }
  a.ext::after { content:"↗"; font-size:10px; opacity:.7; margin-left:1px; }
  .err { color:var(--stub); font-size:12px; }
  code { background:#0c0e13; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<div id="busy"><span class="spinner"></span> <span id="busy-msg">AI가 답변을 생성하는 중…</span></div>
<div id="toast"></div>
<div id="sel-pop">
  <div class="prov" id="sel-src"></div>
  <div id="sel-exist"></div>
  <input id="sel-q" placeholder="이 주제를 물어보기 (Enter) — 비우면 구절 그대로" />
  <div class="row">
    <button id="sel-ask" title="이 주제를 우측 패널로 열기 — 있으면 연결, 없으면 AI가 정리">🤖 묻고 열기</button>
    <button class="sec" id="sel-close">닫기</button>
  </div>
  <div class="prov" id="sel-hint"></div>
</div>
<header>
  <h1>같이 키우는 답</h1>
  <span class="m" style="color:var(--mut)">묻고 · 가려내고 · 물려준다</span>
  <span class="stat" id="stat">…</span>
  <span class="spacer"></span>
  <button class="sec" id="btn-invite" title="동료를 초대해 함께 가려내기 — 지금 보는 공간의 링크를 복사합니다">👥 초대</button>
  <label class="m">공간</label>
  <select id="space" title="함께 보는 공간 — public(모두의 공용) 또는 우리 그룹만의 층">
    <option value="public">public (공용)</option>
  </select>
  <input id="space-new" placeholder="그룹 id 추가" style="width:110px" />
  <button class="sec" id="add-space">+</button>
  <span class="m" id="layer-hint" style="color:var(--acc)"></span>
  <label class="m">나</label>
  <input id="me" value="anon" style="width:90px" />
  <button class="sec" id="btn-reset" title="모든 노드·평가 삭제 (되돌릴 수 없음)">전체 삭제</button>
</header>

<div class="grid">
  <!-- LEFT: Windsurf-style tabs — 검색(진입) / 위치(트리 탐색기) -->
  <aside>
    <div class="tabs">
      <button class="tab active" data-tab="search">🔍 검색</button>
      <button class="tab" data-tab="tree">🗺 위치</button>
    </div>

    <div class="tabpane" id="tab-search">
      <textarea id="search" rows="3" placeholder="궁금한 것을 적고 Enter — 기존 답(공짜)부터 찾고, 없으면 종합, 그래도 없으면 생성"></textarea>
      <div class="row">
        <button id="btn-search" title="1계단 — 이미 있는 답 재사용: 가장 싸고, 사람이 가려낸 답">🔎 기존 답 찾기</button>
        <button id="btn-ask" class="sec" title="3계단(마지막) — 기존·종합으로 안 되면 프런티어 AI가 새 초안 생성">✨ 새 답 생성</button>
        <label class="prov" style="margin-left:auto;cursor:pointer" title="사람이 가려낸(채택) 답을 위로"><input type="checkbox" id="sort-adopted" style="vertical-align:middle"> 채택 우선</label>
      </div>
      <div id="results"></div>

      <h2 class="sec">열린 질의 <button class="link" id="new-query">+ 새 질의</button></h2>
      <div id="query-form" style="display:none">
        <input id="q-title" placeholder="공개 질문 제목" style="width:100%" />
        <textarea id="q-detail" rows="2" placeholder="배경/근거(선택)" style="width:100%;margin-top:4px"></textarea>
        <div class="row"><button id="q-post">질의 등록</button></div>
      </div>
      <div id="queries"></div>
    </div>

    <div class="tabpane" id="tab-tree" style="display:none">
      <h2 class="sec">지식 트리 — 내 위치 <button class="link" id="tree-refresh" title="새로고침">↻</button></h2>
      <div id="tree" class="prov">…</div>
    </div>
  </aside>

  <!-- CENTER: node detail + recursive thread (빈 상태 = 온보딩, init()이 채움) -->
  <section class="center" id="center">
    <div class="empty">…</div>
  </section>

  <!-- RIGHT: my profile (territory share) + scores + economy -->
  <aside class="right">
    <div class="tabs">
      <button class="tab active" data-rtab="map" title="지금 보는 답의 연결 — 드래그·휠줌·팬, 클릭=이동">🕸 연결 지도</button>
      <button class="tab" data-rtab="me" title="내 점유율·안목·재검— 나의 기록">👤 나의 기록</button>
      <button class="tab" data-rtab="board" title="잘 밟힌 길·안목·단골 랭킹">🏆 점수판</button>
    </div>
    <div class="tabpane" id="rtab-map">
      <div id="ego" class="prov">노드를 열면 그 연결이 여기 그려집니다</div>
      <div class="prov" style="margin-top:6px">배치=의미: 위 원답·상위·전제 / 아래 기여·하위 / 좌 정정·대립 / 우 관련·역링크 · 드래그로 정리, 휠로 줌, 빈 곳 끌면 이동, 클릭=열기</div>
    </div>
    <div class="tabpane" id="rtab-me" style="display:none">
    <h2 class="sec" title="내가 만들거나 가려낸 지식이 전체에서 차지하는 몫">내 프로필 — 지식 영역 점유율</h2>
    <div id="me-stats" class="prov">…</div>
    </div>
    <div class="tabpane" id="rtab-board" style="display:none">
    <h2 class="sec" title="많이 *그리고 두루* 밟힌(👣 발자국 받은) 답이 위로 — 내용 가치 점수">잘 밟힌 길 (권위)</h2>
    <div id="top-nodes"></div>
    <h2 class="sec" title="남보다 먼저 좋은 답을 알아본 사람 — 그 답이 나중에 두루 인정받으면 오릅니다">안목 — 앞서 알아본 사람</h2>
    <div id="top-hubs"></div>
    <h2 class="sec" title="발자국(👣 도움됐다는 표시)을 많이 남기며 가려내기에 참여한 사람">단골 — 발자국 많이 남긴 사람</h2>
    <div id="top-evals"></div>
    <details class="econ-adv"><summary>경제 (고급)</summary>
      <div class="row" style="margin-top:6px"><input id="mint-amt" type="number" value="100" style="width:80px" />
        <button id="btn-mint" class="sec">민팅</button></div>
      <div id="ledger" class="prov" style="margin-top:8px"></div>
    </details>
    </div>
  </aside>
</div>

<script>
const $ = s => document.querySelector(s);
const api = async (m, url, body) => {
  const r = await fetch(url, {method:m, cache:'no-store',
    headers:{'Content-Type':'application/json'},
    body: body ? JSON.stringify(body) : undefined});
  if (!r.ok) { const t = await r.text(); throw new Error(t); }
  return r.json();
};
const space = () => $('#space').value;
const me = () => $('#me').value.trim() || 'anon';

// Show a "running" banner (and disable a trigger button) while an async — often
// slow, network-bound AI — action is in flight, so it never looks frozen.
let busyDepth = 0;
async function withBusy(msg, fn, btn){
  busyDepth++;
  $('#busy-msg').textContent = msg;
  $('#busy').classList.add('on');
  let label;
  // 실제 스피너를 누른 버튼 위에 — AI 등 느린 동작 중 버튼이 돈다
  if (btn){ label = btn.innerHTML; btn.disabled = true;
            btn.innerHTML = `<span class="spinner"></span> ${label}`; }
  const t0 = Date.now();
  const tick = setInterval(()=>{
    $('#busy-msg').textContent = `${msg} (${((Date.now()-t0)/1000).toFixed(0)}초)`;
  }, 1000);
  try { return await fn(); }
  finally {
    clearInterval(tick);
    if (--busyDepth <= 0){ busyDepth = 0; $('#busy').classList.remove('on'); }
    if (btn){ btn.disabled = false; btn.innerHTML = label; }
  }
}
// 상단 토스트 — 패널 재렌더로 사라지지 않는 작업 결과 안내
let toastT = null;
function toast(msg, ms=3500){
  const el = $('#toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=> el.classList.remove('on'), ms);
}
const esc = s => (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// render [[wikilinks]] + bare http(s) URLs as clickable
function renderText(t){
  return esc(t)
    // URL 먼저(아직 태그가 없는 평문 단계) → 외부 링크. 끝 문장부호는 링크에서 제외.
    .replace(/(https?:\/\/[^\s<"]+)/g, m => {
      const tail = (m.match(/[.,);!?]+$/) || [''])[0];
      const url = m.slice(0, m.length - tail.length);
      return `<a class="ext" href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>${tail}`;
    })
    .replace(/\[\[([^\]]+)\]\]/g, (_,n)=>`<a class="wl" data-link="${esc(n)}">${esc(n)}</a>`);
}

async function refreshStat(){
  const s = await api('GET','/api/state');
  const p = s.persistence || {};
  let store;
  if (p.backend === 'postgres' && p.db_ok !== false) store = '🟢 DB저장';
  else if (p.backend === 'postgres') store = '🔴 DB오류';
  else store = '🟡 임시(유실위험)';
  const ai = s.ai || {};
  const aiTag = ai.active ? `🤖 ${ai.model}` : '🤖 오프라인스텁';
  const el = $('#stat');
  const saved = p.last_saved_at ? ` · 저장 ${p.last_saved_at.slice(0,19)}` : '';
  el.textContent =
    `노드 ${s.node_count} · 질의 ${s.query_count} · ${s.hub_mode} · ${store}${saved} · ${aiTag}`;
  el.title = [p.error || p.hint || (p.backend==='postgres' ? `Postgres 영속 · 마지막 저장 ${p.last_saved_at||'?'}` : ''),
              ai.hint].filter(Boolean).join('\n');
  loadTree();      // 노드 생성·평가 등으로 상태가 바뀌면 트리도 갱신(노트 09)
  loadMeStats();   // 점유율도 갱신(노트 10 B)
}

function adoptBadge(n){
  if (n.is_query || n.is_stub) return '';
  return n.adopted ? '<span class="badge adopted" title="누군가 밟고 간 길 — 채택됨">채택</span>'
                   : '<span class="badge draft" title="아직 아무도 안 밟음 — 발자국이 찍히면 채택">초안</span>';
}
function nodeItem(n){
  const b = (n.is_query ? '<span class="badge query">질의</span>'
          : n.frozen ? '<span class="badge frozen">AI·동결</span>' : '')
          + ' ' + adoptBadge(n)
          + (n.freshness === 'stale' ? ' <span class="badge" title="1년 넘게 갱신 안 된 답">🔴</span>'
             : n.freshness === 'aging' ? ' <span class="badge" title="90일 넘게 갱신 안 된 답">🟡</span>' : '')
          + (n.contested ? ' <span class="badge" style="border-color:var(--fork);color:var(--fork)" title="정정/다른 답이 제기됨 — 견줘보세요">⚔️</span>' : '');
  const d = document.createElement('div');
  d.className = 'item';
  const wear = (n.staked||0) >= 12 ? '🔥' : (n.staked||0) >= 3 ? '' : (n.staked ? '' : '🌱');
  const indep = (n.indep && n.walkers && n.indep < n.walkers)
    ? ` · 두루 ${n.indep}` : '';
  const conds = (n.conditions||[]).slice(0,2).map(cd=>`<span class="badge cond">${esc(cd)}</span>`).join(' ');
  d.innerHTML = `<div class="t">${esc(n.title)} ${b}</div>
    <div class="m">${esc(n.author)} · 👣 ${n.staked}${wear?' '+wear:''}${indep} · 권위 ${n.authority} ${conds}</div>`;
  d.onclick = ()=> openNode(n.id);
  return d;
}

async function doSearch(){
  const q = $('#search').value.trim();
  let res = await api('GET', `/api/search?q=${encodeURIComponent(q)}&space=${space()}`);
  if ($('#sort-adopted') && $('#sort-adopted').checked)
    res = [...res].sort((a,b)=> (b.adopted?1:0)-(a.adopted?1:0) || b.authority-a.authority);
  const box = $('#results'); box.innerHTML = '';
  if (!res.length){
    box.innerHTML = '<div class="prov">아직 이 길을 걸은 사람이 없습니다 — 아래에서 새 답을 생성하면 당신이 첫 걸음입니다.</div>';
  } else if (q){
    const lead = document.createElement('div');
    lead.className = 'prov';
    const nAdopted = res.filter(n=>n.adopted).length;
    lead.innerHTML = `♻️ 기존 길 <b>${res.length}</b>개${nAdopted?` (사람이 가려낸 답 ${nAdopted}개)`:''} — 재사용은 공짜이고, 이미 검증된 답입니다.`;
    box.appendChild(lead);
  }
  res.forEach(n => box.appendChild(nodeItem(n)));
  // 기존 길이 2개 이상이면 — "종합해서 답변할까요?" (내부 RAG: 근거 안에서만, 출처 자동 링크)
  if (q && res.length >= 2){
    const offer = document.createElement('div');
    offer.className = 'prov';
    offer.style.marginTop = '8px';
    offer.textContent = `위 ${res.length}개의 기존 답을 종합해서 답변할까요?`;
    const go = document.createElement('button');
    go.className = 'sec'; go.style.marginLeft = '6px';
    go.textContent = '📋 종합 답변 만들기';
    go.title = '기존 답들만 근거로 종합(RAG) — 근거에 없는 내용은 지어내지 않고, 출처는 본문 [[링크]]로 박힙니다';
    go.onclick = async ()=>{
      try{
        const r = await withBusy('기존 답들을 종합하는 중…',
          ()=> api('POST','/api/synthesize',{question:q, author:me(), space:space()}), go);
        await refreshStat();
        renderNode(r.node);
        toast(`📚 기존 답 ${r.sources.length}개를 근거로 종합 — 출처는 본문 링크로`);
      }catch(e){ alert('종합 실패: ' + e.message); }
    };
    offer.appendChild(go);
    box.appendChild(offer);
  }
  // 3계단(마지막): 그래도 없으면 생성 — 사다리의 바닥이 아니라 꼭대기(가장 비쌈)
  if (q){
    const last = document.createElement('div');
    last.className = 'prov'; last.style.marginTop = '8px';
    last.textContent = res.length ? '위 답들로 부족하면 —' : '';
    const nb = document.createElement('button');
    nb.className = 'sec'; nb.style.marginLeft = res.length ? '6px' : '0';
    nb.textContent = '✨ 새 답 생성 (AI)';
    nb.title = '프런티어 AI가 새 초안을 만듭니다 — 초안은 사람이 밟아야 채택됩니다';
    nb.onclick = ()=> doAsk();
    last.appendChild(nb);
    box.appendChild(last);
  }
}

async function doAsk(force){
  const q = $('#search').value.trim();
  if (!q) return;
  try {
    const r = await withBusy(force ? 'AI가 새 답변을 생성하는 중…' : 'AI가 답변을 생성하는 중…',
      ()=> api('POST','/api/ask',{question:q, author:me(), space:space(), force:!!force,
                                  api_key: localStorage.getItem('nw_byok') || ''}),
      $('#btn-ask'));
    await refreshStat();
    renderNode(r.node);                 // 새 AI 답 또는 기존 채택본
    if (r.stage === 'ai' && r.quota_left !== null && r.quota_left !== undefined)
      toast(`✨ 새 답 생성 — 오늘 ${r.quota_left}건 남음 (재사용·검색·종합은 무제한)`);
    // 첫 질문 직후 한 번만: 혼자 두지 않기 — 동료 초대 넛지 (교정 3)
    if (!localStorage.getItem('nw_invite_nudged')){
      localStorage.setItem('nw_invite_nudged', '1');
      const b = document.createElement('div');
      b.className = 'prov';
      b.innerHTML = '🤖 AI의 초안이 깔렸습니다. 동료가 보면 고치고 보탤 수 있어요 — ';
      const ib = document.createElement('button');
      ib.className = 'sec'; ib.textContent = '👥 초대 링크 복사';
      ib.onclick = doInvite;
      b.appendChild(ib);
      if (panes().firstChild) panes().firstChild.prepend(b);
    }
    if (r.stage === 'existing'){        // 같은 질문의 채택본이 이미 있음 — 난립 방지
      const banner = document.createElement('div');
      banner.className = 'prov';
      banner.innerHTML = '♻️ 같은 질문에 <b>사람이 가려낸 답</b>(권위 최고본)이 이미 있어 재사용합니다 — 생성 0원. ';
      const btn = document.createElement('button');
      btn.className = 'sec'; btn.textContent = '그래도 새로 묻기';
      btn.onclick = ()=> doAsk(true);
      banner.appendChild(btn);
      if (panes().firstChild) panes().firstChild.prepend(banner);
    }
    // 관련 기존 답이 있으면 밑의 검색 결과 패널에 함께 노출
    const box = $('#results'); box.innerHTML = '';
    if (r.related && r.related.length){
      const h = document.createElement('div');
      h.className = 'prov'; h.textContent = '관련 기존 답:';
      box.appendChild(h);
      r.related.forEach(n => box.appendChild(nodeItem(n)));
    }
  } catch(e){
    if ((e.message||'').includes('쿼터')){
      // 사다리 밖 마지막 문 — 본인 키(BYOK)로 계속. 키는 브라우저에만 저장.
      const k = prompt('오늘의 무료 생성이 끝났어요. 재사용·검색·종합은 계속 무제한!\n' +
                       '계속 생성하려면 본인 Anthropic API 키를 넣으세요 (브라우저에만 저장, 서버 저장 없음):');
      if (k && k.trim()){
        localStorage.setItem('nw_byok', k.trim());
        toast('🔑 내 키로 생성합니다 — 비용은 내 계정으로');
        return doAsk(force);
      }
    }
    alert('AI 질문 실패: ' + e.message);
  }
}

// -- sliding panes: a left→right trail of concept panes ----------------------
// Following a link never replaces what you were reading: it opens the target as
// a NEW pane to the right (truncating anything further right), so the reading
// flow — the chain of concepts — stays visible. (docs/design: 06 navigation)
let trail = [];                         // node ids, oldest(left) → newest(right)
const panes = () => $('#center');
const paneIndexOf = el => [...panes().children].indexOf(el);
const fetchNode = id => api('GET',`/api/nodes/${encodeURIComponent(id)}?space=${space()}`);

async function openNode(id){            // start a FRESH trail (left list / search / scores)
  panes().innerHTML = ''; trail = [];
  await pushPane(id);
}
function renderNode(n){                 // fresh trail from an already-fetched node object
  panes().innerHTML = ''; trail = [n.id];
  focusPane(addPaneEl(n));
}
async function pushPane(id, afterEl){   // open `id` as a new pane right of `afterEl`
  if (afterEl){
    const i = paneIndexOf(afterEl);
    while (panes().children.length > i + 1){ panes().lastChild.remove(); trail.pop(); }
  }
  const n = await fetchNode(id);
  trail.push(n.id);
  const pane = addPaneEl(n);
  focusPane(pane);
  pane.scrollIntoView({behavior:'smooth', inline:'end', block:'nearest'});
}
function addPaneEl(n){
  const pane = document.createElement('div');
  pane.className = 'pane'; pane.dataset.nodeId = n.id;
  pane.onmousedown = ()=> focusPane(pane);
  panes().appendChild(pane);
  fillPane(n, pane);
  return pane;
}
function focusPane(pane){
  panes().querySelectorAll('.pane.active').forEach(p=>p.classList.remove('active'));
  if (pane){
    pane.classList.add('active');
    if (pane.dataset.nodeId) syncTree(pane.dataset.nodeId);   // 트리에 위치 반영
  }
}
// 🕸 연결 지도 — 옵시디안급 동적 에고 그래프 (외부 라이브러리 없음).
// 포스 레이아웃(반발+스프링) 위에 *의미 방향의 약한 중력*을 얹는다:
// 위=원답·상위·전제 / 아래=기여·하위 / 좌=정정·대립 / 우=관련·역링크.
// 드래그로 노드 정리, 휠 줌, 빈 곳 끌어 팬, 클릭(거의 안 움직임)=그 노드 열기.
const EGO = {data:null, raf:0, running:false};
function renderEgo(n){
  EGO.data = n;
  const box = $('#ego'); if (!box) return;
  const paneEl = $('#rtab-map');
  if (paneEl && paneEl.style.display === 'none') return;   // 탭 숨김 — 데이터만 보관
  cancelAnimationFrame(EGO.raf); EGO.running = false;
  if (!n){ box.innerHTML = '<div class="prov">노드를 열면 그 연결이 여기 그려집니다</div>'; return; }
  const kindLbl = {comment:'보강', fork:'정정', followup:'후속', unfold:'펼침', query:'질의', contribute:'보강'};
  const N = [], E = [], seen = new Set([n.id]);
  const add = (id, t, tag, side)=>{
    if (!id || seen.has(id)) return;
    seen.add(id); N.push({id, t:(t||'(답)'), tag, side, vx:0, vy:0});
    E.push({to:id, tag});
  };
  if (n.parent) add(n.parent.id, n.parent.title, '원답', 'u');
  (n.outlinks||[]).forEach(o=>{
    const r = o.rel || '';
    add(o.id, o.title, r || '관련',
        (r==='상위'||r==='전제') ? 'u' : r==='하위' ? 'd' : r==='대립' ? 'l' : 'r');
  });
  (n.thread||[]).forEach(c=> add(c.id, c.title || c.body, kindLbl[c.kind]||c.kind,
                                 c.kind==='fork' ? 'l' : 'd'));
  (n.backlinks||[]).forEach(b=> add(b.id, b.title, '역링크', 'r'));
  if (!N.length){
    box.innerHTML = '<div class="prov">아직 연결이 없습니다 — 본문에 [[개념]]을 걸거나 보강·정정·후속으로 가지를 치면 지도가 자랍니다.</div>';
    return;
  }
  const W = Math.max(box.clientWidth || 320, 280);
  const H = Math.max(420, window.innerHeight - 230);
  const cx = W/2, cy = H/2;
  const C = {id:n.id, t:n.title||'(답)', x:cx, y:cy};
  const anchor = {u:[cx, cy-H*0.33], d:[cx, cy+H*0.33], l:[cx-W*0.36, cy], r:[cx+W*0.36, cy]};
  N.forEach((p,i)=>{ const a = anchor[p.side];
    p.x = a[0] + Math.sin(i*2.4)*46; p.y = a[1] + Math.cos(i*1.7)*36; });
  const colr = t => (t==='정정'||t==='대립') ? '#e0a0ff' : '#8ab4ff';
  const trunc = (s,k)=> (s||'').length>k ? (s||'').slice(0,k-1)+'…' : (s||'');

  box.innerHTML = `<svg id="ego-svg" width="${W}" height="${H}"
    style="max-width:100%;touch-action:none;background:rgba(255,255,255,.02);border-radius:8px">
    <g id="ego-view"></g></svg>`;
  const svg = box.querySelector('#ego-svg'), view = box.querySelector('#ego-view');
  let tx=0, ty=0, sc=1;
  const applyView = ()=> view.setAttribute('transform', `translate(${tx},${ty}) scale(${sc})`);

  const draw = ()=>{
    view.innerHTML =
      E.map(e=>{ const p = N.find(x=>x.id===e.to); if (!p) return '';
        return `<line x1="${C.x}" y1="${C.y}" x2="${p.x}" y2="${p.y}"
            stroke="${colr(e.tag)}" stroke-opacity=".3" stroke-width="1.3"/>
          <text x="${(C.x+p.x)/2}" y="${(C.y+p.y)/2-3}" font-size="9"
            fill="${colr(e.tag)}" fill-opacity=".85" text-anchor="middle">${esc(e.tag)}</text>`;
      }).join('')
      + N.map(p=>`<g class="ego-n" data-gid="${esc(p.id)}" style="cursor:grab">
          <circle cx="${p.x}" cy="${p.y}" r="13" fill="#141b2d" stroke="${colr(p.tag)}" stroke-width="1.5"/>
          <text x="${p.x}" y="${p.y+27}" font-size="11" text-anchor="middle" fill="#cfd8ea">${esc(trunc(p.t,18))}</text>
          <title>${esc(p.t)} — ${esc(p.tag)} (클릭=열기)</title></g>`).join('')
      + `<g><circle cx="${C.x}" cy="${C.y}" r="21" fill="#101828" stroke="#e8c268" stroke-width="2.2"/>
          <text x="${C.x}" y="${C.y+38}" font-size="12" font-weight="600" text-anchor="middle" fill="#e8c268">${esc(trunc(C.t,22))}</text>
          <title>${esc(C.t)} (현재)</title></g>`;
  };

  let heat = 1;
  const step = ()=>{
    const all = [C, ...N];
    for (const p of N){
      if (p.drag) continue;
      let fx = 0, fy = 0;
      const a = anchor[p.side];                       // 의미 방향의 약한 중력
      fx += (a[0]-p.x)*0.013; fy += (a[1]-p.y)*0.013;
      const dx = C.x-p.x, dy = C.y-p.y;               // 중심 스프링(연결 장력)
      const d = Math.hypot(dx,dy) || 1, f = (d-125)*0.011;
      fx += dx/d*f; fy += dy/d*f;
      for (const q of all){ if (q===p) continue;      // 상호 반발(겹침 방지)
        const rx = p.x-q.x, ry = p.y-q.y, r2 = rx*rx+ry*ry || 1;
        const rep = Math.min(1600/r2, 3), r = Math.sqrt(r2);
        fx += rx/r*rep; fy += ry/r*rep; }
      p.vx = (p.vx+fx)*0.8; p.vy = (p.vy+fy)*0.8;
      p.x += p.vx*heat; p.y += p.vy*heat;
    }
  };
  const loop = ()=>{ step(); draw(); heat *= 0.99;
    if (heat > 0.04){ EGO.raf = requestAnimationFrame(loop); }
    else EGO.running = false; };
  const wake = (h)=>{ heat = Math.max(heat, h);
    if (!EGO.running){ EGO.running = true; loop(); } };
  wake(1);

  // 상호작용 — 위임(매 프레임 다시 그려도 살아있게 svg에 건다)
  let mode = null, moved = 0, dragN = null;
  const toWorld = ev => { const r = svg.getBoundingClientRect();
    return [(ev.clientX-r.left-tx)/sc, (ev.clientY-r.top-ty)/sc]; };
  svg.addEventListener('pointerdown', ev=>{
    const g = ev.target.closest('.ego-n'); moved = 0;
    if (g){ dragN = N.find(x=>x.id===g.dataset.gid);
      if (dragN){ dragN.drag = true; mode = 'node'; } }
    else mode = 'pan';
    svg.setPointerCapture(ev.pointerId);
  });
  svg.addEventListener('pointermove', ev=>{
    if (!mode) return;
    moved += Math.abs(ev.movementX) + Math.abs(ev.movementY);
    if (mode === 'node' && dragN){
      const [x,y] = toWorld(ev); dragN.x = x; dragN.y = y; wake(0.4); draw();
    } else if (mode === 'pan'){ tx += ev.movementX; ty += ev.movementY; applyView(); }
  });
  svg.addEventListener('pointerup', ()=>{
    if (mode === 'node' && dragN){ dragN.drag = false;
      if (moved < 5) openNode(dragN.id); else wake(0.3); }
    mode = null; dragN = null;
  });
  svg.addEventListener('wheel', ev=>{
    ev.preventDefault();
    const want = sc * (ev.deltaY < 0 ? 1.12 : 0.9);
    const next = Math.min(3, Math.max(0.3, want));
    const k = next / sc;                    // 클램프 반영한 *유효* 배율 — 초점 고정
    if (k === 1) return;
    const r = svg.getBoundingClientRect();
    const mx = ev.clientX - r.left, my = ev.clientY - r.top;
    tx = mx - (mx-tx)*k; ty = my - (my-ty)*k; sc = next;
    applyView();
  }, {passive:false});
}

async function refreshPane(pane){
  try { fillPane(await fetchNode(pane.dataset.nodeId), pane); }
  catch(e){ closePane(pane); }     // 새 레이어에서 안 보이면 패널 정리
}
function refreshAllPanes(){ [...panes().children].forEach(p => p.dataset.nodeId && refreshPane(p)); }
function closePane(pane){               // close this pane and everything to its right
  const i = paneIndexOf(pane);
  while (panes().children.length > i){ panes().lastChild.remove(); trail.pop(); }
  const last = panes().lastChild;
  renderEgo(last && last._node ? last._node : null);
  if (!panes().children.length) showOnboard();   // 전부 닫히면 온보딩으로
  else focusPane(panes().lastChild);
}

// -- 온보딩: 빈 화면을 남의 씨앗이 아니라 *내 호기심*으로 채운다 (교정 1+3) -----
function showOnboard(){
  trail = [];
  panes().innerHTML = `<div class="empty onboard">
    <h2>혼자 AI와 대화하면 그 답은 증발합니다. 여기서는 남습니다.</h2>
    <p>물으면 AI가 초안을 깔고 — 당신과 동료의 <b>판단(👣) · 보강 · 정정</b>이 그것을
       <b>믿을 수 있는 답</b>으로 만듭니다. 다음 사람은 그 길을 <b>공짜로</b> 다시 씁니다.</p>
    <p class="prov">👣 <b>발자국</b> = "이 답이 맞다/도움됐다"는 한 번의 표시. 눈밭의 길처럼 —
       <b>많이 *그리고 두루*</b> 밟힌 답일수록 위로 올라가고, 그 길을 <b>먼저 알아본 사람의 안목</b>도 함께 쌓입니다.</p>
    <div class="row" style="justify-content:center">
      <input id="onboard-q" placeholder="지금 궁금한 것을 그대로 적어보세요" style="width:62%"/>
      <button id="onboard-go">🤖 첫 질문하기</button>
    </div>
    <p class="prov">① 먼저 검색 — 이미 닦인 길이 있으면 공짜로 읽기 · ② 없으면 AI에게 — 내 첫 길 내기 · ③ 👥 동료 초대 — 함께 가려내기</p>
  </div>`;
  const go = ()=>{ const q = $('#onboard-q').value.trim(); if (!q) return;
    $('#search').value = q; doAsk(); };
  $('#onboard-go').onclick = go;
  $('#onboard-q').addEventListener('keydown', e=>{
    if (e.key==='Enter'){ e.preventDefault(); go(); } });
}

// 초대 — 지금 보는 공간(레이어)의 링크를 복사 (소그룹 점화의 최소 동선)
function inviteURL(){
  const sp = space();
  return location.origin + location.pathname
       + (sp==='public' ? '' : `?space=${encodeURIComponent(sp)}`);
}
async function doInvite(){
  try { await navigator.clipboard.writeText(inviteURL()); }
  catch(e){ prompt('초대 링크를 복사하세요:', inviteURL()); }
  toast(space()==='public'
    ? '👥 초대 링크 복사됨 — 동료와 함께 묻고 가려내세요'
    : `👥 초대 링크 복사됨 — '${space()}' 공간을 함께 봅니다`);
}

// -- LEFT: knowledge tree explorer (노트 09) ---------------------------------
// Root→sub directory of the whole forest (parent_id hierarchy). Clicking a row
// opens that node in the center; the tree always highlights where you are.
let treeData = [];          // nested roots from /api/tree
let treeIndex = {};         // id → {title, parentId, kind}
let treeOpen = {};          // id → expanded? (preserved across reloads)
let curNodeId = null;       // node the center is currently focused on

async function loadTree(){
  try { treeData = await api('GET',`/api/tree?space=${space()}`); }
  catch(e){ $('#tree').innerHTML = `<div class="prov err">${esc(e.message)}</div>`; return; }
  treeIndex = {}; indexTree(treeData, null);
  renderTree();
}
function indexTree(list, parentId){
  list.forEach(n => {
    treeIndex[n.id] = {title:n.title, parentId, kind:n.kind};
    if (n.children && n.children.length) indexTree(n.children, n.id);
  });
}
function treeRowHTML(n, depth){
  const kids = n.children && n.children.length;
  const open = !!treeOpen[n.id];
  const tw = kids ? (open ? '▾' : '▸') : '·';
  // 사람 기여(보강/정정/후속/펼침) = 펼쳐지는 가지. via=link = 루트 밑 참조 잎.
  const kindMap = {comment:'보강', fork:'정정', followup:'후속', unfold:'↳', query:'질의'};
  const kindCls = n.kind==='contribute' ? (n.title ? 'followup' : '') : n.kind;
  const kindLabel = n.via==='link' ? '' : (kindMap[kindCls] || '');
  const ref = n.via==='link' ? ' ref' : '';
  const label = (n.kind==='unfold' && n.anchor) ? `«${esc(n.anchor)}»`
    : (n.via==='link' && n.rel ? `<span class="tkind">${esc(n.rel)}</span>` : '') + esc(n.title);
  const cur = n.id===curNodeId ? ' cur' : '';
  return `<div class="tnode${depth===0?' root':''}">
    <div class="trow${cur}${ref}" data-id="${esc(n.id)}" data-kids="${kids?1:0}">
      <span class="ttwist">${tw}</span>
      <span class="tlabel">${kindLabel?`<span class="tkind ${kindCls}">${kindLabel}</span>`:''}${label}</span>
    </div>
    ${kids ? `<div class="tkids" style="display:${open?'block':'none'}">${
      n.children.map(c=>treeRowHTML(c, depth+1)).join('')}</div>` : ''}
  </div>`;
}
function renderTree(){
  const box = $('#tree');
  box.innerHTML = treeData.length
    ? treeData.map(n=>treeRowHTML(n, 0)).join('')
    : '<div class="prov">아직 개념이 없습니다. 아래에서 AI에게 질문해 첫 노드를 만드세요.</div>';
  box.querySelectorAll('.trow').forEach(row => {
    const id = row.dataset.id;
    if (row.dataset.kids==='1'){
      row.querySelector('.ttwist').onclick = e => {
        e.stopPropagation(); treeOpen[id] = !treeOpen[id]; renderTree();
      };
    }
    row.onclick = () => openNode(id);
  });
  const cur = box.querySelector('.trow.cur');
  if (cur) cur.scrollIntoView({block:'nearest'});
}
// reflect "where am I": expand ancestors of `id`, highlight + scroll to it
function syncTree(id){
  if (id === curNodeId) return;
  curNodeId = id;
  let p = treeIndex[id] && treeIndex[id].parentId;
  while (p){ treeOpen[p] = true; p = treeIndex[p] && treeIndex[p].parentId; }
  if (treeData.length) renderTree();
  // 위치 탭이 숨겨져 있으면 "여기 새 위치" 표시(● ping)
  const tab = document.querySelector('.tab[data-tab="tree"]');
  if (tab && $('#tab-tree') && $('#tab-tree').style.display==='none') tab.classList.add('ping');
}

function threadHTML(list){
  // '계승(follow)'는 내용 없는 빈 항목이라 화면에서 제외 (기능 폐지)
  list = (list || []).filter(c => c.kind !== 'follow');
  if (!list.length) return '';
  return '<div class="thread">' + list.map(c => {
    const cls = c.kind==='fork' ? 'fork' : '';
    const tag = {comment:'보강', fork:'정정/다른 답',
                 contribute: c.title ? '후속질문' : (c.frozen ? '답' : '기여'),
                 root:'답'}[c.kind] || c.kind;
    const frozen = c.frozen ? ' <span class="badge frozen">AI</span>' : '';
    const title = c.title ? `<div class="who"><b>${esc(c.title)}</b></div>` : '';
    // 답(내용 있거나 AI 답)인 항목은 평가 가능 — 질문만 있는 후속질문 노드는 제외
    const canEval = (c.body && c.body.trim()) || c.frozen;
    const evalCtrl = canEval ? `
      <div class="row eval-row">
        <button class="sec eval-btn" data-eid="${esc(c.id)}"
          title="이 가지가 맞다/도움됐다면 한 번 밟으세요 — 두루 밟힐수록 위로 (평가=저작)">👣 나도 밟기</button>
        <span class="prov eval-out">· 👣 ${c.staked}</span>
      </div>` : '';
    const grpBadge = c.space && c.space!=='public'
      ? ` <span class="badge" title="이 그룹에서만 보이는 사적 기여">${esc(c.space)}</span>` : '';
    return `<div class="c ${cls}" data-node-id="${esc(c.id)}">
      <div class="who"><span class="kind-tag">${tag}</span> · ${esc(c.author)}${frozen}${grpBadge}
        · 권위 ${c.authority}</div>
      ${title}
      <div class="body">${renderText(c.body)}</div>
      ${evalCtrl}
      ${actbar(c.id)}
      <div class="reply" data-rid="${esc(c.id)}"></div>
      ${threadHTML(c.replies)}
    </div>`;
  }).join('') + '</div>';
}

function actbar(id){
  // 노드든 가지든 같은 형식으로 재귀 — 어디서나 보강/정정/후속질문(노트 08·정합 감사)
  return `<div class="actbar">
    <button class="sec" data-act="comment" data-id="${id}">보강</button>
    <button class="sec" data-act="fork" data-id="${id}">정정/다른 답</button>
    <button class="sec" data-act="followup" data-id="${id}">후속질문</button>
  </div>`;
}

// 4겹 전면화(노트 15): 스레드를 종류별 섹션으로 — 기여(보강)·대안(다른 답)·후속질문.
// 최상위만 분류하고, 깊은 재귀(가지 안의 가지)는 각 항목 안에서 threadHTML 그대로.
function sectionsHTML(thread){
  const list = (thread || []).filter(c => c.kind !== 'follow');
  const comments = list.filter(c => c.kind === 'comment');
  const forks    = list.filter(c => c.kind === 'fork');
  const quests   = list.filter(c => c.kind === 'contribute' && c.title);
  const rest     = list.filter(c =>
    !comments.includes(c) && !forks.includes(c) && !quests.includes(c));
  const sec = (items, icon, label, hint, open) => !items.length ? '' : `
    <details class="kn-sec"${open ? ' open' : ''}>
      <summary>${icon} ${label} <b>${items.length}</b> <span class="prov">— ${hint}</span></summary>
      ${threadHTML(items)}
    </details>`;
  return sec(comments, '📚', '보강', '사람들이 키운 것', true)
       + sec(forks,    '⚖️', '다른 답·정정', '견줄 것', false)
       + sec(quests,   '❓', '후속질문', '더 파고든 곳', true)
       + (rest.length ? threadHTML(rest) : '');
}

// 발자국 메타포어를 살린 한 줄(노트 13): 길의 '닳음' = 얼마나 두루 밟혔나.
// 👣 = 도움됐다 표시 수, 권위 = 그게 쌓인 신뢰. 발자국이 적으면 '갓 낸 길'.
function footprintLine(n){
  const s = n.staked || 0;
  const wear = s===0 ? '🌱 아직 아무도 안 밟은 길'
    : s<3  ? `👣 ${s} · 갓 난 길`
    : s<12 ? `👣 ${s} · 다져지는 길`
    :        `👣 ${s} 🔥 두루 밟힌 길`;
  // 두루(독립 출처): 같은 무리는 √n 표 — 권위가 '수'가 아니라 '다양성'으로 선다(노트 17)
  const indep = (n.walkers||0) >= 2
    ? ` · 두루 ${n.indep}${n.indep < n.walkers ? `<span class="m">/${n.walkers}</span>` : '명'}` : '';
  return `<span title="👣 = '도움됐다'고 밟은 사람 수 · 두루 = 그중 *서로 독립인* 유효 수(한 무리는 √n표). 많이 그리고 두루 밟힐수록 권위가 섭니다.">${wear}${indep} · 권위 ${n.authority}</span>`;
}

// n번째 발견자(노트 17 §3): 발자국 순서가 곧 자산 — 내가 이 길을 몇 번째로 알아봤나
function discovererLine(n){
  const order = n.walk_order || [];
  const i = order.indexOf(me());
  if (i < 0) return '';
  const after = order.length - i - 1;
  return `<div class="prov" style="color:var(--acc)">👁 당신은 이 길의 <b>${i+1}번째 발견자</b>${
    after > 0 ? ` — 그 후 ${after}명이 따라 걸었습니다` : ' — 아직 당신뿐, 맞다면 안목이 증명됩니다'}</div>`;
}

// 평가 = 저작: 원저자 + 평가로 이 지식을 자기 것으로 인정한 사람들
function coauthorsHTML(list){
  if (!list || !list.length) return '';
  const chips = list.map(a => {
    const role = a.role==='author' ? '원저자' : '평가자(저작)';
    const stk = a.staked ? ` · 👣 ${a.staked}` : '';
    return `<span class="badge co ${a.role}" title="안목 ${a.hub}${stk}">${esc(a.user)} · ${role}</span>`;
  }).join(' ');
  return `<div class="prov">저작: ${chips}</div>`;
}

function fillPane(n, c){
  c._node = n; c.dataset.nodeId = n.id;
  const prov = n.frozen
    ? `AI 답변 · <code>${esc(n.model)}</code> · ${esc(n.answered_at)} (동결 — 편집은 기여로)`
    : `${esc(n.author)} 작성 · 최근 편집 ${esc(n.last_editor)}`;
  const queryAnswer = n.is_query ? `
    <div class="row"><button class="q-ai">AI가 답하기</button>
      <button class="sec q-human">사람이 답하기</button></div>
    <div class="q-answer"></div>` : '';
  const grp = space() !== 'public';        // 그룹 레이어면 평가 시맨틱이 다르다
  // ① 판단(가려냄): 발자국 버튼 — 한 번 밟는 게 곧 '이 길이 맞다'는 표시.
  const endorseTip = grp
    ? `'${esc(space())}' 그룹 안에서만 남는 발자국 — 우리끼리 길을 다집니다`
    : '이 답이 맞다/도움됐다면 한 번 밟으세요. 당신 발자국이 이 길을 남에게 추천하고, '
      + '나중에 두루 인정받으면 *먼저 알아본 당신의 안목*도 함께 쌓입니다 (특허 허브).';
  const endorse = (!n.is_query && !n.is_stub) ? `
      <button class="sec btn-endorse" title="${endorseTip}">👣 나도 밟기</button>
      <span class="prov end-out"></span>` : '';
  const stubFill = n.is_stub ? `
    <div class="row"><button class="btn-fill">🪄 AI로 이 개념 채우기</button>
      <span class="prov fill-out"></span></div>` : '';
  // AI 초안인데 아직 아무도 안 가려냄 → 첫 판단을 청함
  const draftHint = (n.frozen && !n.adopted && !n.is_query && !n.is_stub) ? `
    <div class="prov draft-hint">🤖 AI 초안 — 아직 아무도 가려내지 않았어요. 읽고 맞다면 👣로 첫 판단자가 되어주세요. 아니면 정정을.</div>` : '';
  // 신선도(노트 18 P1): 시계가 계산한 배지 + stale 채택본엔 재검 넛지 — 판정은 사람.
  const freshBadge = n.freshness === 'stale' ? '<span class="badge" title="1년 넘게 갱신 안 된 답">🔴 오래됨</span>'
    : n.freshness === 'aging' ? '<span class="badge" title="90일 넘게 갱신 안 된 답">🟡 묵음</span>' : '';
  const recheckHint = n.recheck ? `
    <div class="prov draft-hint">🕰️ 이 채택답은 오래됐어요 — 아직 유효한가요?
      <button class="sec btn-revalid" title="재검 결과 여전히 맞다 — 신선도 시계를 리셋합니다">✅ 아직 유효함</button>
      낡았다면 <b>정정</b>으로 갱신해 주세요 (지식은 썩습니다 — 판정은 사람이).</div>` : '';
  // 정정 제기됨(노트 21): 이 답에 다른 답·정정이 달림 — 재검은 사람이
  const contestedBadge = n.contested ? '<span class="badge" style="border-color:var(--fork);color:var(--fork)" title="이 답에 정정/다른 답이 제기되어 있습니다 — 아래 스레드에서 견줘보세요">⚔️ 정정 제기됨</span>' : '';
  // 적용 조건 칩(노트 18 P2): AI가 제안, 사람이 탭으로 확정/제거
  const condChips = `<div class="prov cond-row" style="margin-top:4px">${
    (n.conditions||[]).map(cd=>`<span class="badge cond" title="이 답의 적용 조건 — ×로 제거">${esc(cd)} <a class="cond-x" data-c="${esc(cd)}" style="cursor:pointer">×</a></span>`).join(' ')
    }${(!n.is_stub && !n.is_query) ? ' <a class="cond-suggest" style="cursor:pointer" title="AI가 본문에서 적용 조건 후보를 찾아줍니다 — 확정은 당신의 탭">＋조건</a>' : ''}</div>`;
  c.innerHTML = `
    <button class="pane-close" title="이 패널(과 오른쪽)을 닫기">×</button>
    <div class="node-head">
      <h3>${esc(n.title)}</h3>
      ${n.is_query?'<span class="badge query">열린 질의</span>':''}
      ${n.frozen?'<span class="badge frozen">동결</span>':''}
      ${freshBadge}
      ${contestedBadge}
      ${adoptBadge(n)}
      ${n.space && n.space!=='public' ? `<span class="badge">${esc(n.space)}</span>` : ''}
    </div>
    <div class="prov">${prov} · ${footprintLine(n)}</div>
    ${discovererLine(n)}
    ${coauthorsHTML(n.coauthors)}
    ${n.is_query ? '' : (n.is_stub
      ? `<div class="answer prov">아직 비어 있는 개념입니다 — 위키링크로 자리만 잡혔어요. 아래 버튼으로 AI 정리를 생성하세요.</div>`
      : `<div class="answer">${renderText(n.answer)}</div>`)}
    ${condChips}${queryAnswer}${stubFill}${draftHint}${recheckHint}
    ${n.outlinks && n.outlinks.length ? `<div class="prov">연결: ${
      n.outlinks.map(o=>`<span class="olw"><a class="ol" data-oid="${esc(o.id)}">${esc(o.title)}</a><a
        class="rel-chip${o.rel?' set':''}" data-target="${esc(o.id)}"
        title="관계 타입 — 탭해서 확인 (확인한 사람이 많을수록 그 타입이 신뢰를 얻습니다)${
          o.rels && Object.keys(o.rels).length ? ' · ' + Object.entries(o.rels).map(([t,k])=>t+'×'+k).join(' ') : ''}"
        >${o.rel ? esc(o.rel)+(o.rel_n>1?'×'+o.rel_n:'') : '관련'}</a></span>`).join(', ')
    }</div>`:''}
    ${n.backlinks && n.backlinks.length ? `<div class="prov">백링크: ${
      n.backlinks.map(b=>`<a class="wl" data-link="${esc(b.title)}">${esc(b.title)}</a>`).join(', ')
    }</div>`:''}
    <div class="prov" style="margin-top:4px">💡 본문 어디든 드래그하면 그 주제가 오른쪽에 열려요 — 읽거나, 더 물어 가지치기.</div>
    ${sectionsHTML(n.thread)}
    <div class="actbar main">
      ${endorse}
      <button class="sec" data-act="comment" data-id="${esc(n.id)}">+ 보강</button>
      <button class="sec" data-act="fork" data-id="${esc(n.id)}">+ 정정/다른 답</button>
      <button class="sec" data-act="followup" data-id="${esc(n.id)}">+ 후속질문</button>
    </div>
    <div class="reply" data-rid="${esc(n.id)}"></div>`;

  c.querySelector('.pane-close').onclick = ()=> closePane(c);

  // 링크는 *오른쪽 새 패널*로 펼친다(흐름 보존). 본문 [[wikilink]]는 제목→id를
  // outlink/backlink 맵으로 해소; 못 찾으면 검색으로 폴백.
  const linkMap = {};
  (n.outlinks||[]).concat(n.backlinks||[]).forEach(o => { if (o.id) linkMap[o.title] = o.id; });
  c.querySelectorAll('.ol').forEach(a => a.onclick = ()=> pushPane(a.dataset.oid, c));
  // 시멘틱 릴레이션 칩(노트 16): 탭 → 타입 4개 팝오버 → 확인(사람이 채택, 자동 없음)
  c.querySelectorAll('.rel-chip').forEach(ch => ch.onclick = (ev)=>{
    ev.stopPropagation();
    document.querySelectorAll('.rel-pop').forEach(p=>p.remove());
    const pop = document.createElement('div'); pop.className = 'rel-pop';
    ['상위','하위','전제','대립'].forEach(rt=>{
      const b = document.createElement('button'); b.className='sec'; b.textContent = rt;
      b.title = {상위:'대상이 이 개념의 일반화/포함', 하위:'대상이 이 개념의 구체화/사례',
                 전제:'대상을 먼저 알아야 함', 대립:'대상과 충돌·반례'}[rt];
      b.onclick = async ()=>{ pop.remove();
        try{
          await api('POST', `/api/nodes/${encodeURIComponent(n.id)}/relate`,
            {target: ch.dataset.target, rel: rt, author: me()});
          toast(`관계 확인: ${rt} — 확인이 쌓일수록 신뢰가 붙습니다`);
          refreshPane(c);
        }catch(e){ alert('관계 확인 실패: ' + e.message); }
      };
      pop.appendChild(b);
    });
    const r = ch.getBoundingClientRect();
    pop.style.left = r.left + 'px'; pop.style.top = (r.bottom + 4) + 'px';
    document.body.appendChild(pop);
    setTimeout(()=> document.addEventListener('click', ()=> pop.remove(), {once:true}));
  });
  const rv = c.querySelector('.btn-revalid');
  if (rv) rv.onclick = async ()=>{
    try{
      await api('POST', `/api/nodes/${encodeURIComponent(n.id)}/reconfirm`, {author: me()});
      toast('✅ 재검 완료 — 이 답의 신선도 시계가 리셋됐습니다');
      refreshPane(c);
    }catch(e){ alert(e.message); }
  };
  // 조건 패싯(노트 18 P2): × 제거 / ＋조건 → AI 후보 → 탭으로 확정
  c.querySelectorAll('.cond-x').forEach(x => x.onclick = async (ev)=>{
    ev.stopPropagation();
    try{ await api('POST', `/api/nodes/${encodeURIComponent(n.id)}/conditions`,
                   {remove:[x.dataset.c], add:[], author: me()});
         refreshPane(c); }catch(e){ alert(e.message); }
  });
  const sug = c.querySelector('.cond-suggest');
  if (sug) sug.onclick = async (ev)=>{
    ev.stopPropagation(); sug.textContent = '…';
    try{
      const r = await api('POST', `/api/nodes/${encodeURIComponent(n.id)}/conditions/suggest`,
                          {author: me()});
      const row = c.querySelector('.cond-row');
      if (!(r.suggestions||[]).length){ toast('본문에서 찾은 조건 후보가 없어요'); sug.textContent='＋조건'; return; }
      r.suggestions.forEach(sgt=>{
        const b = document.createElement('a');
        b.className='badge'; b.style.cursor='pointer'; b.style.opacity='.65';
        b.textContent = `＋ ${sgt}`; b.title = 'AI 후보 — 탭하면 조건으로 확정';
        b.onclick = async ()=>{ try{
          await api('POST', `/api/nodes/${encodeURIComponent(n.id)}/conditions`,
                    {add:[sgt], remove:[], author: me()});
          toast('조건 확정 — 이 답이 언제 유효한지 다음 사람이 압니다');
          refreshPane(c); }catch(e){ alert(e.message); } };
        row.insertBefore(b, sug);
      });
      sug.textContent='＋조건';
    }catch(e){ alert(e.message); sug.textContent='＋조건'; }
  };
  c.querySelectorAll('a.wl').forEach(a => a.onclick = ()=> {
    const id = linkMap[a.dataset.link];
    if (id) pushPane(id, c);
    else { $('#search').value = a.dataset.link; doSearch(); }
  });

  // 활성(맨 오른쪽) 패널의 연결을 우측 지도에 즉시 반영 — 기여를 달면
  // refreshPane→fillPane 경로로 새 링크가 바로 지도에 나타난다.
  if (c.parentElement && c === c.parentElement.lastElementChild) renderEgo(n);
  c.querySelectorAll('button[data-act]').forEach(b =>
    b.onclick = ()=> showReply(b.dataset.id, b.dataset.act, c));
  c.querySelectorAll('.eval-btn').forEach(b =>
    b.onclick = async ()=>{
      const row = b.closest('.eval-row');
      const out = row.querySelector('.eval-out');
      try{
        const r = await withBusy('발자국 남기는 중…',
          ()=> api('POST','/api/endorse',
            {account:me(), node_id:b.dataset.eid, amount:1, space:space()}), b);
        toast(r.balance===undefined
          ? `👣 발자국을 남겼어요 (${r.space})` : `👣 발자국을 남겼어요`);
        loadLedger(); loadScores(); refreshPane(c);
      }catch(e){ out.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    });
  if (n.is_query){
    c.querySelector('.q-ai').onclick = async (ev)=>{
      try {
        await withBusy('AI가 답변을 생성하는 중…',
          ()=> api('POST',`/api/queries/${encodeURIComponent(n.id)}/answer`,
            {author:me(), ai:true, space:space()}), ev.currentTarget);
        await refreshStat(); refreshPane(c);
      } catch(e){ alert('AI 답변 실패: ' + e.message); }
    };
    c.querySelector('.q-human').onclick = ()=> {
      c.querySelector('.q-answer').innerHTML =
        `<textarea class="q-htext" rows="3" style="width:100%;margin-top:6px" placeholder="답변"></textarea>
         <div class="row"><button class="q-hsave">답변 저장</button></div>`;
      c.querySelector('.q-hsave').onclick = async ()=>{
        await api('POST',`/api/queries/${encodeURIComponent(n.id)}/answer`,
          {author:me(), body:c.querySelector('.q-htext').value, space:space()});
        await refreshStat(); refreshPane(c);
      };
    };
  }
  if (n.is_stub){
    c.querySelector('.btn-fill').onclick = async (ev)=>{
      try{
        await withBusy('AI가 개념을 정리하는 중…',
          ()=> api('POST',`/api/nodes/${encodeURIComponent(n.id)}/fill`,
            {author:me(), space:space()}), ev.currentTarget);
        toast('AI가 개념을 채웠습니다');
        await refreshStat(); loadScores(); refreshPane(c);
      }catch(e){ c.querySelector('.fill-out').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    };
  }
  if (!n.is_query && !n.is_stub){
    c.querySelector('.btn-endorse').onclick = async (ev)=>{
      const out = c.querySelector('.end-out');
      try{
        const first = !n.staked;   // 첫 발자국이면 길이 '채택'으로 살아남
        const r = await withBusy('길을 밟는 중…',
          ()=> api('POST','/api/endorse',
            {account:me(), node_id:n.id, amount:1, space:space()}), ev.currentTarget);
        toast(r.balance===undefined
          ? `👣 ${r.space} 안에서 이 길을 밟았어요`
          : first ? '👣 첫 발자국 — 이 길이 채택됐어요. 뒷사람이 더 쉽게 찾습니다'
                  : '👣 밟았어요 — 두루 밟힐수록 위로 올라가고, 먼저 알아본 안목도 쌓입니다');
        loadLedger(); loadScores(); refreshPane(c);
      }catch(e){ out.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    };
  }
}

function showReply(id, act, pane){
  // find the reply box within THIS pane (ids can repeat across panes; ::,~,. also
  // break CSS id selectors, so match data-rid by value)
  const box = [...pane.querySelectorAll('.reply')].find(r => r.dataset.rid === id);
  if (!box) return;
  const ph = {comment:'보강할 의견 — 웹 링크(URL) 붙여넣어도 됩니다',
              fork:'왜 기존 답이 틀렸나(반례·실측·적용 조건) + 교정된 답 — 근거 URL 환영. 이유가 남아야 틀린 답이 부활하지 못합니다',
              followup:'후속 질문'}[act];
  const goLabel = act==='followup' ? 'AI에게 묻기' : '보내기';
  box.innerHTML = `<textarea placeholder="${ph}"></textarea>
    <div class="row"><button data-go>${goLabel}</button>
      <button class="sec" data-cancel>취소</button></div>`;
  const goBtn = box.querySelector('[data-go]');
  goBtn.onclick = ()=> submitContrib(id, act, box.querySelector('textarea').value, goBtn, pane);
  box.querySelector('[data-cancel]').onclick = ()=> box.innerHTML='';
}

async function submitContrib(id, kind, body, btn, pane){
  // a follow-up asks the AI for a fresh answer → slow; the rest are instant
  const msg = kind==='followup' ? 'AI가 후속 답변을 생성하는 중…' : '처리 중…';
  try{
    await withBusy(msg,
      ()=> api('POST',`/api/nodes/${encodeURIComponent(id)}/contribute`,
        {kind, author:me(), body, space:space()}), btn);
    await refreshStat(); loadScores();
    await refreshPane(pane);   // re-render this pane's thread in place
    // 새 기여는 패널 하단 스레드에 붙는다 — 다시 그린 뒤 스크롤이 위에 머물면
    // 방금 쓴 글이 안 보인다. 내가 쓴 항목으로(못 찾으면 맨 아래로) 데려간다.
    requestAnimationFrame(()=>{
      const probe = (body || '').trim().slice(0, 40);
      const mine = probe && [...pane.querySelectorAll('.c')].reverse()
        .find(el => el.textContent.includes(probe));
      if (mine) mine.scrollIntoView({behavior:'smooth', block:'center'});
      else pane.scrollTo({top: pane.scrollHeight, behavior:'smooth'});
    });
  }catch(e){ alert(e.message); }
}

// 내 프로필 — 지식 영역 점유율(노트 10 B). 숫자 클릭하면 내 노드 상세가 펼쳐진다.
async function loadMeStats(){
  let s;
  try { s = await api('GET',`/api/me/stats?user=${encodeURIComponent(me())}&space=${space()}`); }
  catch(e){ $('#me-stats').innerHTML = `<span class="err">${esc(e.message)}</span>`; return; }
  const ov = s.overall;
  const allMine = s.categories.flatMap(c => c.mine);
  const nodeLinks = ms => ms.length
    ? ms.map(m=>`<a class="me-node" data-oid="${esc(m.id)}" title="${esc(m.title)}">${esc(m.title)}</a>`).join('')
    : '<span class="prov">내 노드 없음</span>';
  const cats = s.categories.filter(c => c.total > 0).slice(0, 8).map(c => `
    <div class="sc cat-row" data-cat="${esc(c.id)}">
      <span class="cat-t">${esc(c.title)}</span>
      <span class="v">${c.pct}% <span class="prov">(${c.authored}/${c.total})</span></span>
    </div>
    <div class="cat-detail" style="display:none">${nodeLinks(c.mine)}</div>`).join('');
  const grp = s.group ? `
    <div class="sc big" data-ov="grp"><span>그룹 «${esc(s.group.space)}» 점유율</span>
      <span class="v">${s.group.pct}% <span class="prov">· 안목 ${s.group.hub}</span></span></div>` : '';
  // 👁 안목의 길들(노트 17 §3): 내가 먼저 밟고, 뒤에 따라온 길 — 검증의 순간을 보여줌
  const fs = s.foresight || [];
  const fsHTML = fs.length ? `
    <div class="prov" style="margin:10px 0 2px" title="내가 일찍 밟은 길을 그 후 몇 명이 따라 걸었나 — 따라온 사람이 늘수록 내 안목(허브)이 쌓입니다">👁 내 안목 — 먼저 밟고, 뒤에 따라온 길</div>
    ${fs.filter(f=>f.after>0).slice(0,5).map(f=>`
      <div class="sc"><a class="me-node" data-oid="${esc(f.id)}" title="${esc(f.title)}">${esc(f.title)}</a>
        <span class="v" title="내가 ${f.pos}번째, 그 후 ${f.after}명">${f.pos}번째 · +${f.after}명</span></div>`).join('')
    || '<div class="prov">아직 따라온 사람 없음 — 밟아둔 길이 자라면 여기 보입니다</div>'}` : '';
  // 🔎 재검(노트 21): 내가 밟은 길에 정정이 제기됨 — 갈아탈지 재판단은 나의 몫
  const rc = s.recheck || [];
  const rcHTML = rc.length ? `
    <div class="prov" style="margin:10px 0 2px" title="당신이 밟은 답에 정정/다른 답이 제기됐습니다 — 다시 보고, 정정이 맞다면 그쪽을 밟아주세요. 판정은 사람이 합니다">🔎 재검 — 내가 밟은 길에 정정이 제기됨</div>
    ${rc.map(r=>`
      <div class="sc"><a class="me-node" data-oid="${esc(r.id)}" title="${esc(r.fork_note)}">${esc(r.title)}</a>
        <span class="v" style="color:var(--fork)">⚔️ 재검</span></div>`).join('')}` : '';
  $('#me-stats').innerHTML = `
    <div class="prov">나 <b>${esc(s.user)}</b> · 안목(허브) ${s.hub}</div>
    <div class="sc big" data-ov="all"><span>전체 점유율</span>
      <span class="v">${ov.pct}% <span class="prov">(${ov.authored}/${ov.total})</span></span></div>
    <div class="cat-detail" data-detail="all" style="display:none">${nodeLinks(allMine)}</div>
    <div class="prov" style="margin:8px 0 2px">영역(루트)별 · 영향력 권위 ${ov.authority} (${ov.authority_pct}%)</div>
    ${cats || '<div class="prov">아직 없음</div>'}
    ${grp}
    ${rcHTML}
    ${fsHTML}
    <div class="row" style="margin-top:8px">
      <button class="sec" id="export-mine" title="내가 정리한 노드를 옵시디안 볼트(zip)로 — [[위키링크]] 그대로">⬇ 옵시디안으로 내보내기</button>
    </div>`;
  // 검증 이벤트(노트 17 §3): 지난 방문 이후 내 이른 발자국 뒤로 따라온 사람이 늘면 알림.
  // 첫 방문은 기준선만 저장(조용히) — 보상 발명이 아니라 이미 일어난 결과의 가시화.
  try{
    const key = 'nw_fs_' + me();
    const seen = JSON.parse(localStorage.getItem(key) || '{}');
    const grown = fs.filter(f => seen[f.id] !== undefined && f.after > seen[f.id]);
    if (grown.length){
      const top = grown[0];
      toast(`👁 당신이 ${top.pos}번째로 밟은 '${top.title.slice(0,20)}'${grown.length>1?` 외 ${grown.length-1}곳`:''}을 그 후 다른 사람들이 따라 걸었습니다 — 안목이 쌓였어요`, 6000);
    }
    fs.forEach(f => seen[f.id] = f.after);
    localStorage.setItem(key, JSON.stringify(seen));
  }catch(e){}
  // 클릭 → 상세 토글(다음 형제 .cat-detail). 전체는 data-detail="all"을 토글.
  const box = $('#me-stats');
  box.querySelectorAll('.cat-row').forEach(r => r.onclick = ()=>{
    const d = r.nextElementSibling;
    if (d && d.classList.contains('cat-detail'))
      d.style.display = d.style.display==='none' ? 'block' : 'none';
  });
  const ovRow = box.querySelector('[data-ov="all"]');
  if (ovRow) ovRow.onclick = ()=>{
    const d = box.querySelector('[data-detail="all"]');
    d.style.display = d.style.display==='none' ? 'block' : 'none';
  };
  box.querySelectorAll('.me-node').forEach(a => a.onclick = ()=> openNode(a.dataset.oid));
  $('#export-mine').onclick = ()=>{
    location.href = `/api/export?user=${encodeURIComponent(me())}&space=${space()}&scope=mine`;
  };
}

async function loadScores(){
  const s = await api('GET',`/api/scores?space=${space()}`);
  $('#top-nodes').innerHTML = s.top_nodes.length ? s.top_nodes.map(n =>
    `<div class="sc"><span class="wl-row" data-id="${n.id}">${esc(n.title)}</span>
       <span class="v">${n.authority}</span></div>`).join('')
    : '<div class="prov">아직 없음</div>';
  $('#top-nodes').querySelectorAll('[data-id]').forEach(e=>{
    e.style.cursor='pointer'; e.onclick=()=>openNode(e.dataset.id);
  });
  $('#top-hubs').innerHTML = s.top_contributors.length ? s.top_contributors.map(u =>
    `<div class="sc"><span>${esc(u.user)}</span><span class="v">${u.hub}</span></div>`).join('')
    : '<div class="prov">아직 없음</div>';
  const ev = s.top_evaluators || [];
  $('#top-evals').innerHTML = ev.length ? ev.map(u =>
    `<div class="sc"><span>${esc(u.user)}</span><span class="v">${u.staked}</span></div>`).join('')
    : '<div class="prov">아직 없음</div>';
}

async function loadLedger(){
  const l = await api('GET','/api/ledger');
  const bals = Object.entries(l.available).map(([k,v])=>`${esc(k)}: ${v}`).join(' · ');
  $('#ledger').innerHTML = `잔액 — ${bals||'없음'}<br>소각 ${l.burned}`;
}

// -- 가리키기: 본문 구절 드래그 → 우측에 그 주제를 연다(노트 08) --------------
// slug 링크 클릭과 동일한 단일 제스처. 선택 패널 + 가장 가까운 노드(스레드 가지 포함)
let selPane = null, selNodeId = null, selText = '';
function pointOpen(question){           // 가리킨 주제를 우측 패널로 열기(있으면 연결)
  return withBusy('AI에게 묻고 여는 중…',
    ()=> api('POST',`/api/nodes/${encodeURIComponent(selNodeId)}/expand`,
      {question, author:me(), space:space()}), $('#sel-ask'))
    .then(async r=>{
      $('#sel-pop').style.display='none';
      await refreshStat(); refreshPane(selPane);        // 연결 반영(어느 깊이든)
      await pushPane(r.target.id, selPane);             // 그 주제를 오른쪽 패널로
    });
}
document.addEventListener('mouseup', e=>{
  const pop = $('#sel-pop');
  if (e.target.closest('#sel-pop')) return;            // 팝업 안 클릭은 무시
  const sel = window.getSelection();
  const text = sel ? sel.toString().trim() : '';
  const anchorEl = sel && sel.anchorNode
    ? (sel.anchorNode.nodeType===3 ? sel.anchorNode.parentElement : sel.anchorNode) : null;
  const pane = anchorEl ? anchorEl.closest('.pane') : null;
  // 답 본문 또는 스레드 가지 본문에서 고른 텍스트만 — 어느 깊이서나 동작
  if (!text || !pane || !anchorEl.closest('.answer, .body')){ pop.style.display='none'; return; }
  const host = anchorEl.closest('[data-node-id]');     // 스레드 가지 or 패널 루트
  selPane = pane; selNodeId = host ? host.dataset.nodeId : pane.dataset.nodeId; selText = text;
  const r = sel.getRangeAt(0).getBoundingClientRect();
  pop.style.left = r.left + 'px'; pop.style.top = (r.bottom + 6) + 'px';   // #sel-pop=fixed
  $('#sel-q').value = text;
  $('#sel-src').textContent = `선택: "${text.slice(0,40)}${text.length>40?'…':''}"`;
  $('#sel-exist').innerHTML = ''; $('#sel-hint').textContent = '';
  pop.style.display = 'block';
  // "이미 정리된 게 있나" 존재 확인 → 있으면 '바로 열기'(읽기) 지름길(노트 08)
  api('POST','/api/classify',{span:text}).then(r=>{
    if (selText !== text || pop.style.display==='none') return;   // 선택 바뀌면 무시
    if (r.existing){
      $('#sel-exist').innerHTML =
        `<div class="prov">이미 정리됨: <a class="ol" id="sel-open">${esc(r.existing.title)}</a> — 읽거나, 더 물어보세요</div>`;
      $('#sel-open').onclick = ()=>{ $('#sel-pop').style.display='none'; pushPane(r.existing.id, selPane); };
    } else {
      $('#sel-hint').textContent = '새 주제 — 물으면 AI가 정리합니다';
    }
  }).catch(()=>{});
});
$('#sel-close').onclick = ()=> $('#sel-pop').style.display='none';
// 묻고 열기 — 그 주제를 우측 패널로(있으면 연결, 없으면 AI 정리). 단일 경로.
$('#sel-ask').onclick = ()=>{
  const q = $('#sel-q').value.trim() || selText;
  if (!q || !selNodeId || !selPane || !selPane.isConnected) return;
  pointOpen(q).catch(e=> alert('실패: ' + e.message));
};
$('#sel-q').addEventListener('keydown', e=>{
  if (e.key==='Enter'){ e.preventDefault(); $('#sel-ask').click(); }
});

// -- wiring ------------------------------------------------------------------
$('#btn-search').onclick = doSearch;
$('#btn-ask').onclick = ()=> doAsk();
if ($('#sort-adopted')) $('#sort-adopted').onchange = doSearch;
// 우측 탭(지도/나의 기록/점수판) — 지도 탭으로 돌아오면 마지막 노드로 재렌더
document.querySelectorAll('[data-rtab]').forEach(b => b.onclick = ()=>{
  document.querySelectorAll('[data-rtab]').forEach(x=> x.classList.toggle('active', x===b));
  ['map','me','board'].forEach(k=>{ const p = $('#rtab-'+k);
    if (p) p.style.display = (b.dataset.rtab === k ? '' : 'none'); });
  if (b.dataset.rtab === 'map') renderEgo(EGO.data);
});
$('#search').addEventListener('keydown', e=>{
  if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); doSearch(); }
});
$('#new-query').onclick = ()=> {
  const f = $('#query-form'); f.style.display = f.style.display==='none'?'block':'none';
};
$('#q-post').onclick = async ()=>{
  const r = await api('POST','/api/queries',
    {title:$('#q-title').value, detail:$('#q-detail').value, author:me(), space:space()});
  $('#q-title').value=''; $('#q-detail').value=''; $('#query-form').style.display='none';
  await refreshStat(); loadQueries(); renderNode(r);
};
$('#btn-mint').onclick = async ()=>{
  await api('POST','/api/mint',{account:me(), amount:Number($('#mint-amt').value)});
  loadLedger();
};
$('#btn-reset').onclick = async ()=>{
  if (!confirm('모든 노드·평가·포인트를 삭제합니다. 되돌릴 수 없습니다. 진행할까요?')) return;
  try {
    await withBusy('전체 삭제 중…',
      ()=> api('POST','/api/admin/reset?confirm=DELETE-ALL'), $('#btn-reset'));
    showOnboard();
    await refreshStat(); reloadAll();
  } catch(e){ alert('삭제 실패: ' + e.message); }
};
$('#add-space').onclick = ()=>{
  const v = $('#space-new').value.trim(); if(!v) return;
  if (![...$('#space').options].some(o=>o.value===v)){
    const o = document.createElement('option'); o.value=o.textContent=v;
    $('#space').appendChild(o);
  }
  $('#space').value = v; $('#space-new').value=''; onSpaceChange();
};
$('#space').onchange = onSpaceChange;

function onSpaceChange(){           // 레이어 바뀌면 좌·우뿐 아니라 *열린 패널*도 갱신
  reloadAll();
  refreshAllPanes();
  updateLayerHint();
}
function updateLayerHint(){
  const sp = space();
  $('#layer-hint').textContent = sp==='public' ? '' : `· ${sp} 오버레이로 보는 중`;
}
function reloadAll(){ doSearch(); loadQueries(); loadScores(); loadLedger(); loadTree(); loadMeStats(); }
$('#tree-refresh').onclick = loadTree;
$('#me').onchange = ()=> { loadMeStats(); loadScores(); };   // 정체성 바꾸면 내 점유율 갱신

// 좌측 탭 전환 (Windsurf식: 검색 / 위치)
function showTab(name){
  document.querySelectorAll('.tab[data-tab]').forEach(t => t.classList.toggle('active', t.dataset.tab===name));
  $('#tab-search').style.display = name==='search' ? '' : 'none';
  $('#tab-tree').style.display   = name==='tree'   ? '' : 'none';
  if (name==='tree'){
    document.querySelector('.tab[data-tab="tree"]').classList.remove('ping');
    const cur = $('#tree').querySelector('.trow.cur');   // 탭 열 때 현재 위치로 스크롤
    if (cur) cur.scrollIntoView({block:'nearest'});
  }
}
document.querySelectorAll('.tab[data-tab]').forEach(t => t.onclick = ()=> showTab(t.dataset.tab));  // 좌측 탭만 — 우측은 data-rtab
$('#btn-invite').onclick = doInvite;
(async function init(){
  // 초대 링크(?space=그룹)로 들어오면 그 공간으로 합류 (교정 3)
  const sp = new URLSearchParams(location.search).get('space');
  if (sp && sp !== 'public'){
    if (![...$('#space').options].some(o => o.value === sp)){
      const o = document.createElement('option'); o.value = o.textContent = sp;
      $('#space').appendChild(o);
    }
    $('#space').value = sp;
  }
  showOnboard();
  await refreshStat(); reloadAll(); updateLayerHint();
})();
</script>
</body>
</html>
