<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>업무 지식 정리</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --fg:#e6e8ee;
          --mut:#9aa3b2; --acc:#7aa2ff; --good:#5ad19a; --warn:#ffcf6b;
          --link:#8ab4ff; --stub:#c98a8a; --fork:#e0a0ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.6 system-ui,"Apple SD Gothic Neo",sans-serif; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex;
           gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  header .stat { color:var(--mut); font-size:12px; }
  header .spacer { flex:1; }
  input, textarea, select { background:#0c0e13; color:var(--fg);
    border:1px solid var(--line); border-radius:6px; padding:7px 9px; font:inherit; }
  .grid { display:grid; grid-template-columns:340px 1fr 270px; gap:0;
          height:calc(100vh - 51px); }
  aside { overflow:auto; padding:12px; }
  aside { border-right:1px solid var(--line); }
  aside.right { border-right:0; border-left:1px solid var(--line); }
  /* CENTER = horizontal stack of sliding panes (Roam/Matuschak식): 링크를 따라가면
     우측으로 새 패널이 쌓여 읽기 흐름이 끊기지 않는다. */
  .center { overflow-x:auto; overflow-y:hidden; padding:0; display:flex; align-items:stretch; }
  .pane { flex:0 0 clamp(340px, 44vw, 560px); overflow-y:auto; padding:12px 14px;
          border-right:1px solid var(--line); position:relative; }
  .pane.active { box-shadow: inset 3px 0 0 var(--acc); }
  .pane-close { position:absolute; top:8px; right:10px; background:none; color:var(--mut);
                font-size:16px; padding:0 4px; cursor:pointer; }
  .crumbs { font-size:11px; color:var(--mut); margin-bottom:6px; }
  .crumbs a { color:var(--link); cursor:pointer; }
  @media (max-width:880px){ .grid { grid-template-columns:1fr; height:auto; }
    .pane { flex-basis:88vw; } }
  /* LEFT: IDE-style knowledge tree explorer (노트 09) */
  #tree { font-size:13px; max-height:42vh; overflow:auto; margin-bottom:4px;
          border:1px solid var(--line); border-radius:8px; padding:5px 4px; }
  .trow { display:flex; align-items:center; gap:4px; padding:2px 4px; border-radius:5px;
          cursor:pointer; white-space:nowrap; }
  .trow:hover { background:#1a1f29; }
  .trow.cur { background:#1e3a2b; box-shadow:inset 2px 0 0 var(--good); }
  .ttwist { flex:0 0 13px; text-align:center; color:var(--mut); user-select:none; font-size:11px; }
  .tlabel { overflow:hidden; text-overflow:ellipsis; }
  .tkind { font-size:9px; padding:0 4px; border-radius:8px; border:1px solid var(--line);
           color:var(--mut); margin-right:4px; vertical-align:1px; }
  .tkind.comment { color:var(--good); border-color:#2c4; }
  .tkind.fork    { color:var(--fork); border-color:var(--fork); }
  .tkind.followup{ color:var(--link); border-color:var(--link); }
  .tkind.unfold  { color:var(--warn); border-color:var(--warn); }
  /* root concepts = the spine: bold + diamond marker + a little air above */
  .tnode.root > .trow { margin-top:3px; }
  .tnode.root > .trow .tlabel { font-weight:700; }
  .tnode.root > .trow .tlabel::before { content:"◆ "; color:var(--acc); font-weight:400; }
  /* link refs (slug/드래그로 가리킨 개념) = 루트 밑 참조 — 흐리게 + → 표시.
     사람 기여(보강/정정/후속)는 알맹이라 밝게 둔다. */
  .trow.ref .tlabel { color:var(--mut); }
  .trow.ref .tlabel::before { content:"→ "; color:var(--link); }
  /* each level steps in with its own guide rail */
  .tkids { margin-left:7px; border-left:1px solid var(--line); padding-left:7px; }
  h2.sec { font-size:11px; color:var(--acc); text-transform:uppercase;
           letter-spacing:.5px; margin:16px 0 6px; }
  button { background:var(--acc); color:#0a0c10; border:0; border-radius:6px;
           padding:7px 11px; font-weight:600; cursor:pointer; }
  button.sec { background:#252a35; color:var(--fg); }
  button.link { background:none; color:var(--link); padding:0; font-weight:400;
                cursor:pointer; border:0; }
  #search { width:100%; }
  .row { display:flex; gap:6px; align-items:center; margin-top:6px; }
  .item { padding:8px 10px; border:1px solid var(--line); border-radius:8px;
          margin:6px 0; cursor:pointer; background:var(--panel); }
  .item:hover { border-color:var(--acc); }
  .item .t { font-weight:600; }
  .item .m { color:var(--mut); font-size:12px; }
  .badge { font-size:11px; padding:1px 6px; border-radius:10px; border:1px solid var(--line);
           color:var(--mut); }
  .badge.frozen { color:var(--warn); border-color:var(--warn); }
  .badge.query { color:var(--good); border-color:var(--good); }
  .badge.co.author { color:var(--acc); border-color:var(--acc); }
  .badge.co.evaluator { color:var(--link); border-color:var(--link); }
  .badge.adopted { color:var(--good); border-color:var(--good); }
  .badge.draft { color:var(--mut); border-color:var(--mut); }
  .answer { white-space:pre-wrap; background:var(--panel); border:1px solid var(--line);
            border-radius:8px; padding:12px; margin:8px 0; }
  /* AI busy indicator */
  @keyframes spin { to { transform:rotate(360deg); } }
  .spinner { display:inline-block; width:13px; height:13px; vertical-align:-2px;
             border:2px solid var(--mut); border-top-color:var(--acc);
             border-radius:50%; animation:spin .8s linear infinite; }
  #busy { position:fixed; top:0; left:0; right:0; z-index:50; display:none;
          gap:8px; align-items:center; justify-content:center; padding:7px 12px;
          background:rgba(122,162,255,.14); border-bottom:1px solid var(--acc);
          color:var(--fg); font-size:13px; }
  #busy.on { display:flex; }
  .inline-busy { color:var(--acc); font-size:12px; }
  button[disabled] { opacity:.55; cursor:progress; }
  /* 본문 드래그 → AI에게 묻고 연결 팝업 (fixed: 패널 내부 스크롤과 무관하게 정확) */
  #sel-pop { position:fixed; display:none; z-index:60; width:280px; padding:8px;
             background:var(--panel); border:1px solid var(--acc); border-radius:8px;
             box-shadow:0 6px 20px rgba(0,0,0,.45); }
  #sel-pop input { width:100%; margin:4px 0; }
  #sel-hint { margin-top:6px; min-height:14px; }
  #sel-exist { margin:2px 0 4px; }
  /* 작업 결과(평가·채우기 등) 토스트 — 패널 재렌더로 사라지지 않게 화면 상단 고정 */
  #toast { position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:70;
           display:none; max-width:80vw; padding:8px 14px; border-radius:8px;
           background:#1d2530; border:1px solid var(--acc); color:var(--fg); font-size:13px;
           box-shadow:0 6px 20px rgba(0,0,0,.45); }
  #toast.on { display:block; }
  .wl-row, .ol { color:var(--link); cursor:pointer; }
  .node-head { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .node-head h3 { margin:0; font-size:18px; }
  .prov { color:var(--mut); font-size:12px; }
  .thread { margin-top:10px; }
  .c { border-left:2px solid var(--line); padding:6px 0 6px 12px; margin:6px 0 6px 4px; }
  .c .who { font-size:12px; }
  .c.fork { border-color:var(--fork); }
  .c .body { white-space:pre-wrap; margin:2px 0; }
  .kind-tag { font-size:11px; color:var(--mut); }
  /* 상시 '묻기' 입력(노트 08) — 답 바로 아래, 읽고 부족하면 그 자리서 가지치기 */
  .ask-row { display:flex; gap:6px; margin:8px 0; }
  .ask-row input { flex:1; }
  .actbar { display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
  .actbar button { padding:3px 8px; font-size:12px; font-weight:500; }
  .reply { margin-top:6px; }
  .reply textarea { width:100%; min-height:50px; }
  .empty { color:var(--mut); padding:20px; text-align:center; }
  .sc { display:flex; justify-content:space-between; font-size:13px; padding:2px 0; }
  .sc .v { color:var(--good); }
  a.wl { color:var(--link); cursor:pointer; }
  .err { color:var(--stub); font-size:12px; }
  code { background:#0c0e13; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<div id="busy"><span class="spinner"></span> <span id="busy-msg">AI가 답변을 생성하는 중…</span></div>
<div id="toast"></div>
<div id="sel-pop">
  <div class="prov" id="sel-src"></div>
  <div id="sel-exist"></div>
  <input id="sel-q" placeholder="이 주제를 물어보기 (Enter) — 비우면 구절 그대로" />
  <div class="row">
    <button id="sel-ask" title="이 주제를 우측 패널로 열기 — 있으면 연결, 없으면 AI가 정리">🤖 묻고 열기</button>
    <button class="sec" id="sel-close">닫기</button>
  </div>
  <div class="prov" id="sel-hint"></div>
</div>
<header>
  <h1>업무 지식 정리</h1>
  <span class="stat" id="stat">…</span>
  <span class="spacer"></span>
  <label class="m">레이어</label>
  <select id="space" title="보는 층 (공용 commons + 그룹 오버레이)">
    <option value="public">public (공용)</option>
  </select>
  <input id="space-new" placeholder="그룹 id 추가" style="width:110px" />
  <button class="sec" id="add-space">+</button>
  <span class="m" id="layer-hint" style="color:var(--acc)"></span>
  <label class="m">나</label>
  <input id="me" value="anon" style="width:90px" />
  <button class="sec" id="btn-reset" title="모든 노드·평가 삭제 (되돌릴 수 없음)">전체 삭제</button>
</header>

<div class="grid">
  <!-- LEFT: search first (entry) → tree (organize under the root it spawns) -->
  <aside>
    <h2 class="sec">질문하기 · 검색</h2>
    <textarea id="search" rows="3" placeholder="궁금한 것을 적고 Enter로 검색, 또는 AI에게 질문"></textarea>
    <div class="row">
      <button id="btn-search" class="sec">검색</button>
      <button id="btn-ask">AI에게 질문</button>
    </div>
    <div id="results"></div>

    <h2 class="sec">지식 트리 <button class="link" id="tree-refresh" title="새로고침">↻</button></h2>
    <div id="tree" class="prov">…</div>

    <h2 class="sec">열린 질의 <button class="link" id="new-query">+ 새 질의</button></h2>
    <div id="query-form" style="display:none">
      <input id="q-title" placeholder="공개 질문 제목" style="width:100%" />
      <textarea id="q-detail" rows="2" placeholder="배경/근거(선택)" style="width:100%;margin-top:4px"></textarea>
      <div class="row"><button id="q-post">질의 등록</button></div>
    </div>
    <div id="queries"></div>
  </aside>

  <!-- CENTER: node detail + recursive thread -->
  <section class="center" id="center">
    <div class="empty">왼쪽에서 답을 고르거나, AI에게 질문해 새 노드를 만드세요.</div>
  </section>

  <!-- RIGHT: scores + economy -->
  <aside class="right">
    <h2 class="sec">권위 (내용 가치)</h2>
    <div id="top-nodes"></div>
    <h2 class="sec">허브 (안목)</h2>
    <div id="top-hubs"></div>
    <h2 class="sec">채택 평가자 (스테이크)</h2>
    <div id="top-evals"></div>
    <h2 class="sec">포인트 경제</h2>
    <div class="row"><input id="mint-amt" type="number" value="100" style="width:80px" />
      <button id="btn-mint" class="sec">민팅</button></div>
    <div id="ledger" class="prov" style="margin-top:8px"></div>
  </aside>
</div>

<script>
const $ = s => document.querySelector(s);
const api = async (m, url, body) => {
  const r = await fetch(url, {method:m, cache:'no-store',
    headers:{'Content-Type':'application/json'},
    body: body ? JSON.stringify(body) : undefined});
  if (!r.ok) { const t = await r.text(); throw new Error(t); }
  return r.json();
};
const space = () => $('#space').value;
const me = () => $('#me').value.trim() || 'anon';

// Show a "running" banner (and disable a trigger button) while an async — often
// slow, network-bound AI — action is in flight, so it never looks frozen.
let busyDepth = 0;
async function withBusy(msg, fn, btn){
  busyDepth++;
  $('#busy-msg').textContent = msg;
  $('#busy').classList.add('on');
  let label;
  // 실제 스피너를 누른 버튼 위에 — AI 등 느린 동작 중 버튼이 돈다
  if (btn){ label = btn.innerHTML; btn.disabled = true;
            btn.innerHTML = `<span class="spinner"></span> ${label}`; }
  const t0 = Date.now();
  const tick = setInterval(()=>{
    $('#busy-msg').textContent = `${msg} (${((Date.now()-t0)/1000).toFixed(0)}초)`;
  }, 1000);
  try { return await fn(); }
  finally {
    clearInterval(tick);
    if (--busyDepth <= 0){ busyDepth = 0; $('#busy').classList.remove('on'); }
    if (btn){ btn.disabled = false; btn.innerHTML = label; }
  }
}
// 상단 토스트 — 패널 재렌더로 사라지지 않는 작업 결과 안내
let toastT = null;
function toast(msg, ms=3500){
  const el = $('#toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=> el.classList.remove('on'), ms);
}
const esc = s => (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// render [[wikilinks]] as clickable
function renderText(t){
  return esc(t).replace(/\[\[([^\]]+)\]\]/g, (_,n)=>`<a class="wl" data-link="${esc(n)}">${esc(n)}</a>`);
}

async function refreshStat(){
  const s = await api('GET','/api/state');
  const p = s.persistence || {};
  let store;
  if (p.backend === 'postgres' && p.db_ok !== false) store = '🟢 DB저장';
  else if (p.backend === 'postgres') store = '🔴 DB오류';
  else store = '🟡 임시(유실위험)';
  const ai = s.ai || {};
  const aiTag = ai.active ? `🤖 ${ai.model}` : '🤖 오프라인스텁';
  const el = $('#stat');
  const saved = p.last_saved_at ? ` · 저장 ${p.last_saved_at.slice(0,19)}` : '';
  el.textContent =
    `노드 ${s.node_count} · 질의 ${s.query_count} · ${s.hub_mode} · ${store}${saved} · ${aiTag}`;
  el.title = [p.error || p.hint || (p.backend==='postgres' ? `Postgres 영속 · 마지막 저장 ${p.last_saved_at||'?'}` : ''),
              ai.hint].filter(Boolean).join('\n');
  loadTree();   // 노드 생성·평가 등으로 상태가 바뀌면 트리도 갱신(노트 09)
}

function adoptBadge(n){
  if (n.is_query || n.is_stub) return '';
  return n.adopted ? '<span class="badge adopted">채택</span>'
                   : '<span class="badge draft" title="아직 평가 안 됨 — 평가하면 채택됩니다">초안</span>';
}
function nodeItem(n){
  const b = (n.is_query ? '<span class="badge query">질의</span>'
          : n.frozen ? '<span class="badge frozen">AI·동결</span>' : '')
          + ' ' + adoptBadge(n);
  const d = document.createElement('div');
  d.className = 'item';
  d.innerHTML = `<div class="t">${esc(n.title)} ${b}</div>
    <div class="m">${esc(n.author)} · 권위 ${n.authority} · 스테이크 ${n.staked}</div>`;
  d.onclick = ()=> openNode(n.id);
  return d;
}

async function doSearch(){
  const q = $('#search').value.trim();
  const res = await api('GET', `/api/search?q=${encodeURIComponent(q)}&space=${space()}`);
  const box = $('#results'); box.innerHTML = '';
  if (!res.length) box.innerHTML = '<div class="prov">검색 결과 없음 — AI에게 질문해보세요.</div>';
  res.forEach(n => box.appendChild(nodeItem(n)));
}

async function doAsk(force){
  const q = $('#search').value.trim();
  if (!q) return;
  try {
    const r = await withBusy(force ? 'AI가 새 답변을 생성하는 중…' : 'AI가 답변을 생성하는 중…',
      ()=> api('POST','/api/ask',{question:q, author:me(), space:space(), force:!!force}),
      $('#btn-ask'));
    await refreshStat();
    renderNode(r.node);                 // 새 AI 답 또는 기존 채택본
    if (r.stage === 'existing'){        // 같은 질문의 채택본이 이미 있음 — 난립 방지
      const banner = document.createElement('div');
      banner.className = 'prov';
      banner.innerHTML = '이미 <b>채택된 답</b>이 있어 보여드립니다. ';
      const btn = document.createElement('button');
      btn.className = 'sec'; btn.textContent = '그래도 새로 묻기';
      btn.onclick = ()=> doAsk(true);
      banner.appendChild(btn);
      if (panes().firstChild) panes().firstChild.prepend(banner);
    }
    // 관련 기존 답이 있으면 밑의 검색 결과 패널에 함께 노출
    const box = $('#results'); box.innerHTML = '';
    if (r.related && r.related.length){
      const h = document.createElement('div');
      h.className = 'prov'; h.textContent = '관련 기존 답:';
      box.appendChild(h);
      r.related.forEach(n => box.appendChild(nodeItem(n)));
    }
  } catch(e){ alert('AI 질문 실패: ' + e.message); }
}

async function loadQueries(){
  const qs = await api('GET',`/api/queries?space=${space()}`);
  const box = $('#queries'); box.innerHTML = '';
  if (!qs.length) box.innerHTML = '<div class="prov">열린 질의 없음.</div>';
  qs.forEach(n => box.appendChild(nodeItem(n)));
}

// -- sliding panes: a left→right trail of concept panes ----------------------
// Following a link never replaces what you were reading: it opens the target as
// a NEW pane to the right (truncating anything further right), so the reading
// flow — the chain of concepts — stays visible. (docs/design: 06 navigation)
let trail = [];                         // node ids, oldest(left) → newest(right)
const panes = () => $('#center');
const paneIndexOf = el => [...panes().children].indexOf(el);
const fetchNode = id => api('GET',`/api/nodes/${encodeURIComponent(id)}?space=${space()}`);

async function openNode(id){            // start a FRESH trail (left list / search / scores)
  panes().innerHTML = ''; trail = [];
  await pushPane(id);
}
function renderNode(n){                 // fresh trail from an already-fetched node object
  panes().innerHTML = ''; trail = [n.id];
  focusPane(addPaneEl(n));
}
async function pushPane(id, afterEl){   // open `id` as a new pane right of `afterEl`
  if (afterEl){
    const i = paneIndexOf(afterEl);
    while (panes().children.length > i + 1){ panes().lastChild.remove(); trail.pop(); }
  }
  const n = await fetchNode(id);
  trail.push(n.id);
  const pane = addPaneEl(n);
  focusPane(pane);
  pane.scrollIntoView({behavior:'smooth', inline:'end', block:'nearest'});
}
function addPaneEl(n){
  const pane = document.createElement('div');
  pane.className = 'pane'; pane.dataset.nodeId = n.id;
  pane.onmousedown = ()=> focusPane(pane);
  panes().appendChild(pane);
  fillPane(n, pane);
  return pane;
}
function focusPane(pane){
  panes().querySelectorAll('.pane.active').forEach(p=>p.classList.remove('active'));
  if (pane){
    pane.classList.add('active');
    if (pane.dataset.nodeId) syncTree(pane.dataset.nodeId);   // 트리에 위치 반영
  }
}
async function refreshPane(pane){
  try { fillPane(await fetchNode(pane.dataset.nodeId), pane); }
  catch(e){ closePane(pane); }     // 새 레이어에서 안 보이면 패널 정리
}
function refreshAllPanes(){ [...panes().children].forEach(p => p.dataset.nodeId && refreshPane(p)); }
function closePane(pane){               // close this pane and everything to its right
  const i = paneIndexOf(pane);
  while (panes().children.length > i){ panes().lastChild.remove(); trail.pop(); }
  if (!panes().children.length)         // 전부 닫히면 빈 안내
    panes().innerHTML = '<div class="empty">왼쪽에서 답을 고르거나, AI에게 질문해 새 노드를 만드세요.</div>';
  else focusPane(panes().lastChild);
}

// -- LEFT: knowledge tree explorer (노트 09) ---------------------------------
// Root→sub directory of the whole forest (parent_id hierarchy). Clicking a row
// opens that node in the center; the tree always highlights where you are.
let treeData = [];          // nested roots from /api/tree
let treeIndex = {};         // id → {title, parentId, kind}
let treeOpen = {};          // id → expanded? (preserved across reloads)
let curNodeId = null;       // node the center is currently focused on

async function loadTree(){
  try { treeData = await api('GET',`/api/tree?space=${space()}`); }
  catch(e){ $('#tree').innerHTML = `<div class="prov err">${esc(e.message)}</div>`; return; }
  treeIndex = {}; indexTree(treeData, null);
  renderTree();
}
function indexTree(list, parentId){
  list.forEach(n => {
    treeIndex[n.id] = {title:n.title, parentId, kind:n.kind};
    if (n.children && n.children.length) indexTree(n.children, n.id);
  });
}
function treeRowHTML(n, depth){
  const kids = n.children && n.children.length;
  const open = !!treeOpen[n.id];
  const tw = kids ? (open ? '▾' : '▸') : '·';
  // 사람 기여(보강/정정/후속/펼침) = 펼쳐지는 가지. via=link = 루트 밑 참조 잎.
  const kindMap = {comment:'보강', fork:'정정', followup:'후속', unfold:'↳', query:'질의'};
  const kindCls = n.kind==='contribute' ? (n.title ? 'followup' : '') : n.kind;
  const kindLabel = n.via==='link' ? '' : (kindMap[kindCls] || '');
  const ref = n.via==='link' ? ' ref' : '';
  const label = (n.kind==='unfold' && n.anchor) ? `«${esc(n.anchor)}»` : esc(n.title);
  const cur = n.id===curNodeId ? ' cur' : '';
  return `<div class="tnode${depth===0?' root':''}">
    <div class="trow${cur}${ref}" data-id="${esc(n.id)}" data-kids="${kids?1:0}">
      <span class="ttwist">${tw}</span>
      <span class="tlabel">${kindLabel?`<span class="tkind ${kindCls}">${kindLabel}</span>`:''}${label}</span>
    </div>
    ${kids ? `<div class="tkids" style="display:${open?'block':'none'}">${
      n.children.map(c=>treeRowHTML(c, depth+1)).join('')}</div>` : ''}
  </div>`;
}
function renderTree(){
  const box = $('#tree');
  box.innerHTML = treeData.length
    ? treeData.map(n=>treeRowHTML(n, 0)).join('')
    : '<div class="prov">아직 개념이 없습니다. 아래에서 AI에게 질문해 첫 노드를 만드세요.</div>';
  box.querySelectorAll('.trow').forEach(row => {
    const id = row.dataset.id;
    if (row.dataset.kids==='1'){
      row.querySelector('.ttwist').onclick = e => {
        e.stopPropagation(); treeOpen[id] = !treeOpen[id]; renderTree();
      };
    }
    row.onclick = () => openNode(id);
  });
  const cur = box.querySelector('.trow.cur');
  if (cur) cur.scrollIntoView({block:'nearest'});
}
// reflect "where am I": expand ancestors of `id`, highlight + scroll to it
function syncTree(id){
  if (id === curNodeId) return;
  curNodeId = id;
  let p = treeIndex[id] && treeIndex[id].parentId;
  while (p){ treeOpen[p] = true; p = treeIndex[p] && treeIndex[p].parentId; }
  if (treeData.length) renderTree();
}

function threadHTML(list){
  // '계승(follow)'는 내용 없는 빈 항목이라 화면에서 제외 (기능 폐지)
  list = (list || []).filter(c => c.kind !== 'follow');
  if (!list.length) return '';
  return '<div class="thread">' + list.map(c => {
    const cls = c.kind==='fork' ? 'fork' : '';
    const tag = {comment:'보강', fork:'정정/다른 답',
                 contribute: c.title ? '후속질문' : '기여', root:'답'}[c.kind] || c.kind;
    const frozen = c.frozen ? ' <span class="badge frozen">AI</span>' : '';
    const title = c.title ? `<div class="who"><b>${esc(c.title)}</b></div>` : '';
    // 답(내용 있거나 AI 답)인 항목은 평가 가능 — 질문만 있는 후속질문 노드는 제외
    const canEval = (c.body && c.body.trim()) || c.frozen;
    const evalCtrl = canEval ? `
      <div class="row eval-row">
        <input class="eval-amt" type="number" value="10" style="width:64px"/>
        <button class="sec eval-btn" data-eid="${esc(c.id)}"
          title="이 답에 동의·스테이크하고 배당받기 (평가=저작)">평가</button>
        <span class="prov eval-out">· 스테이크 ${c.staked}</span>
      </div>` : '';
    const grpBadge = c.space && c.space!=='public'
      ? ` <span class="badge" title="이 그룹에서만 보이는 사적 기여">${esc(c.space)}</span>` : '';
    return `<div class="c ${cls}" data-node-id="${esc(c.id)}">
      <div class="who"><span class="kind-tag">${tag}</span> · ${esc(c.author)}${frozen}${grpBadge}
        · 권위 ${c.authority}</div>
      ${title}
      <div class="body">${renderText(c.body)}</div>
      ${evalCtrl}
      ${actbar(c.id)}
      <div class="reply" data-rid="${esc(c.id)}"></div>
      ${threadHTML(c.replies)}
    </div>`;
  }).join('') + '</div>';
}

function actbar(id){
  return `<div class="actbar">
    <button class="sec" data-act="comment" data-id="${id}">보강</button>
    <button class="sec" data-act="fork" data-id="${id}">정정/다른 답</button>
    <button class="sec" data-act="followup" data-id="${id}">후속질문</button>
  </div>`;
}

// 평가 = 저작: 원저자 + 평가로 이 지식을 자기 것으로 인정한 사람들
function coauthorsHTML(list){
  if (!list || !list.length) return '';
  const chips = list.map(a => {
    const role = a.role==='author' ? '원저자' : '평가자(저작)';
    const stk = a.staked ? ` ·스테이크 ${a.staked}` : '';
    return `<span class="badge co ${a.role}" title="안목 ${a.hub}${stk}">${esc(a.user)} · ${role}</span>`;
  }).join(' ');
  return `<div class="prov">저작: ${chips}</div>`;
}

function fillPane(n, c){
  c._node = n; c.dataset.nodeId = n.id;
  const prov = n.frozen
    ? `AI 답변 · <code>${esc(n.model)}</code> · ${esc(n.answered_at)} (동결 — 편집은 기여로)`
    : `${esc(n.author)} 작성 · 최근 편집 ${esc(n.last_editor)}`;
  const queryAnswer = n.is_query ? `
    <div class="row"><button class="q-ai">AI가 답하기</button>
      <button class="sec q-human">사람이 답하기</button></div>
    <div class="q-answer"></div>` : '';
  const grp = space() !== 'public';        // 그룹 레이어면 평가 시맨틱이 다르다
  const endorse = (!n.is_query && !n.is_stub) ? `
    <div class="row"><input class="end-amt" type="number" value="10" style="width:80px"/>
      <button class="sec btn-endorse" title="${grp
        ? `'${esc(space())}' 그룹 내부에서만 보이는 사적 평가 — 자유발행 그룹 코인, 공통 권위·잔액에 무영향`
        : '공통 코인을 스테이크하고 배당받기 (평가=저작)'}">${grp ? `사적 평가 (${esc(space())} 코인)` : '평가 (스테이크+배당)'}</button>
      <span class="prov end-out"></span></div>` : '';
  const stubFill = n.is_stub ? `
    <div class="row"><button class="btn-fill">🪄 AI로 이 개념 채우기</button>
      <span class="prov fill-out"></span></div>` : '';
  // 상시 '묻기' — 답을 읽고 부족하면 그 자리서 가지치기(노트 08)
  const askRow = (!n.is_query && !n.is_stub) ? `
    <div class="ask-row">
      <input class="ask-q" placeholder="이 주제를 더 묻기 → 가지치기 (Enter)"/>
      <button class="sec ask-go">🤖 묻기</button>
    </div>` : '';
  c.innerHTML = `
    <button class="pane-close" title="이 패널(과 오른쪽)을 닫기">×</button>
    <div class="node-head">
      <h3>${esc(n.title)}</h3>
      ${n.is_query?'<span class="badge query">열린 질의</span>':''}
      ${n.frozen?'<span class="badge frozen">동결</span>':''}
      ${adoptBadge(n)}
      ${n.space && n.space!=='public' ? `<span class="badge">${esc(n.space)}</span>` : ''}
    </div>
    <div class="prov">${prov} · 권위 ${n.authority} · 스테이크 ${n.staked}</div>
    ${coauthorsHTML(n.coauthors)}
    ${n.is_query ? '' : (n.is_stub
      ? `<div class="answer prov">아직 비어 있는 개념입니다 — 위키링크로 자리만 잡혔어요. 아래 버튼으로 AI 정리를 생성하세요.</div>`
      : `<div class="answer">${renderText(n.answer)}</div>`)}
    ${askRow}
    ${queryAnswer}${endorse}${stubFill}
    ${n.outlinks && n.outlinks.length ? `<div class="prov">연결: ${
      n.outlinks.map(o=>`<a class="ol" data-oid="${esc(o.id)}">${esc(o.title)}</a>`).join(', ')
    }</div>`:''}
    ${n.backlinks && n.backlinks.length ? `<div class="prov">백링크: ${
      n.backlinks.map(b=>`<a class="wl" data-link="${esc(b.title)}">${esc(b.title)}</a>`).join(', ')
    }</div>`:''}
    <div class="prov" style="margin-top:4px">💡 본문 어디든 드래그하면 그 주제가 오른쪽에 열려요 — 읽거나, 더 물어 가지치기. 링크도 오른쪽으로 펼쳐집니다.</div>
    <h2 class="sec">스레드 — 이 슬롯에 무엇이든 재귀로 붙습니다</h2>
    ${actbar(n.id)}
    <div class="reply" data-rid="${esc(n.id)}"></div>
    ${threadHTML(n.thread || [])}`;

  c.querySelector('.pane-close').onclick = ()=> closePane(c);

  // 상시 '묻기' → 후속 가지(이 주제를 더 파고들기). 노트 08.
  const askGo = c.querySelector('.ask-go');
  if (askGo){
    const fire = ()=>{ const q = c.querySelector('.ask-q').value.trim();
      if (q) submitContrib(n.id, 'followup', q, askGo, c); };
    askGo.onclick = fire;
    c.querySelector('.ask-q').addEventListener('keydown',
      ev=>{ if (ev.key==='Enter'){ ev.preventDefault(); fire(); } });
  }

  // 링크는 *오른쪽 새 패널*로 펼친다(흐름 보존). 본문 [[wikilink]]는 제목→id를
  // outlink/backlink 맵으로 해소; 못 찾으면 검색으로 폴백.
  const linkMap = {};
  (n.outlinks||[]).concat(n.backlinks||[]).forEach(o => { if (o.id) linkMap[o.title] = o.id; });
  c.querySelectorAll('.ol').forEach(a => a.onclick = ()=> pushPane(a.dataset.oid, c));
  c.querySelectorAll('a.wl').forEach(a => a.onclick = ()=> {
    const id = linkMap[a.dataset.link];
    if (id) pushPane(id, c);
    else { $('#search').value = a.dataset.link; doSearch(); }
  });

  c.querySelectorAll('button[data-act]').forEach(b =>
    b.onclick = ()=> showReply(b.dataset.id, b.dataset.act, c));
  c.querySelectorAll('.eval-btn').forEach(b =>
    b.onclick = async ()=>{
      const row = b.closest('.eval-row');
      const out = row.querySelector('.eval-out');
      try{
        const r = await withBusy('평가 처리 중…',
          ()=> api('POST','/api/endorse',
            {account:me(), node_id:b.dataset.eid, amount:Number(row.querySelector('.eval-amt').value), space:space()}), b);
        toast(r.balance===undefined
          ? `사적 평가 완료 (${r.space}) · 그룹 권위 ${r.group_authority}`
          : `평가 완료 · 잔액 ${r.balance} · 배당 ${JSON.stringify(r.payouts)}`);
        loadLedger(); loadScores(); refreshPane(c);
      }catch(e){ out.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    });
  if (n.is_query){
    c.querySelector('.q-ai').onclick = async (ev)=>{
      try {
        await withBusy('AI가 답변을 생성하는 중…',
          ()=> api('POST',`/api/queries/${encodeURIComponent(n.id)}/answer`,
            {author:me(), ai:true, space:space()}), ev.currentTarget);
        await refreshStat(); refreshPane(c);
      } catch(e){ alert('AI 답변 실패: ' + e.message); }
    };
    c.querySelector('.q-human').onclick = ()=> {
      c.querySelector('.q-answer').innerHTML =
        `<textarea class="q-htext" rows="3" style="width:100%;margin-top:6px" placeholder="답변"></textarea>
         <div class="row"><button class="q-hsave">답변 저장</button></div>`;
      c.querySelector('.q-hsave').onclick = async ()=>{
        await api('POST',`/api/queries/${encodeURIComponent(n.id)}/answer`,
          {author:me(), body:c.querySelector('.q-htext').value, space:space()});
        await refreshStat(); refreshPane(c);
      };
    };
  }
  if (n.is_stub){
    c.querySelector('.btn-fill').onclick = async (ev)=>{
      try{
        await withBusy('AI가 개념을 정리하는 중…',
          ()=> api('POST',`/api/nodes/${encodeURIComponent(n.id)}/fill`,
            {author:me(), space:space()}), ev.currentTarget);
        toast('AI가 개념을 채웠습니다');
        await refreshStat(); loadScores(); refreshPane(c);
      }catch(e){ c.querySelector('.fill-out').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    };
  }
  if (!n.is_query && !n.is_stub){
    c.querySelector('.btn-endorse').onclick = async (ev)=>{
      const out = c.querySelector('.end-out');
      try{
        const r = await withBusy('평가 처리 중…',
          ()=> api('POST','/api/endorse',
            {account:me(), node_id:n.id, amount:Number(c.querySelector('.end-amt').value), space:space()}), ev.currentTarget);
        toast(r.balance===undefined
          ? `사적 평가 완료 (${r.space}) · 그룹 권위 ${r.group_authority}`
          : `평가 완료 · 잔액 ${r.balance} · 배당 ${JSON.stringify(r.payouts)}`);
        loadLedger(); loadScores(); refreshPane(c);
      }catch(e){ out.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    };
  }
}

function showReply(id, act, pane){
  // find the reply box within THIS pane (ids can repeat across panes; ::,~,. also
  // break CSS id selectors, so match data-rid by value)
  const box = [...pane.querySelectorAll('.reply')].find(r => r.dataset.rid === id);
  if (!box) return;
  const ph = {comment:'보강할 의견', fork:'정정 또는 다른 답', followup:'후속 질문'}[act];
  const goLabel = act==='followup' ? 'AI에게 묻기' : '보내기';
  box.innerHTML = `<textarea placeholder="${ph}"></textarea>
    <div class="row"><button data-go>${goLabel}</button>
      <button class="sec" data-cancel>취소</button></div>`;
  const goBtn = box.querySelector('[data-go]');
  goBtn.onclick = ()=> submitContrib(id, act, box.querySelector('textarea').value, goBtn, pane);
  box.querySelector('[data-cancel]').onclick = ()=> box.innerHTML='';
}

async function submitContrib(id, kind, body, btn, pane){
  // a follow-up asks the AI for a fresh answer → slow; the rest are instant
  const msg = kind==='followup' ? 'AI가 후속 답변을 생성하는 중…' : '처리 중…';
  try{
    await withBusy(msg,
      ()=> api('POST',`/api/nodes/${encodeURIComponent(id)}/contribute`,
        {kind, author:me(), body, space:space()}), btn);
    await refreshStat(); loadScores();
    refreshPane(pane);   // re-render this pane's thread in place (flow preserved)
  }catch(e){ alert(e.message); }
}

async function loadScores(){
  const s = await api('GET',`/api/scores?space=${space()}`);
  $('#top-nodes').innerHTML = s.top_nodes.length ? s.top_nodes.map(n =>
    `<div class="sc"><span class="wl-row" data-id="${n.id}">${esc(n.title)}</span>
       <span class="v">${n.authority}</span></div>`).join('')
    : '<div class="prov">아직 없음</div>';
  $('#top-nodes').querySelectorAll('[data-id]').forEach(e=>{
    e.style.cursor='pointer'; e.onclick=()=>openNode(e.dataset.id);
  });
  $('#top-hubs').innerHTML = s.top_contributors.length ? s.top_contributors.map(u =>
    `<div class="sc"><span>${esc(u.user)}</span><span class="v">${u.hub}</span></div>`).join('')
    : '<div class="prov">아직 없음</div>';
  const ev = s.top_evaluators || [];
  $('#top-evals').innerHTML = ev.length ? ev.map(u =>
    `<div class="sc"><span>${esc(u.user)}</span><span class="v">${u.staked}</span></div>`).join('')
    : '<div class="prov">아직 없음</div>';
}

async function loadLedger(){
  const l = await api('GET','/api/ledger');
  const bals = Object.entries(l.available).map(([k,v])=>`${esc(k)}: ${v}`).join(' · ');
  $('#ledger').innerHTML = `잔액 — ${bals||'없음'}<br>소각 ${l.burned}`;
}

// -- 가리키기: 본문 구절 드래그 → 우측에 그 주제를 연다(노트 08) --------------
// slug 링크 클릭과 동일한 단일 제스처. 선택 패널 + 가장 가까운 노드(스레드 가지 포함)
let selPane = null, selNodeId = null, selText = '';
function pointOpen(question){           // 가리킨 주제를 우측 패널로 열기(있으면 연결)
  return withBusy('AI에게 묻고 여는 중…',
    ()=> api('POST',`/api/nodes/${encodeURIComponent(selNodeId)}/expand`,
      {question, author:me(), space:space()}), $('#sel-ask'))
    .then(async r=>{
      $('#sel-pop').style.display='none';
      await refreshStat(); refreshPane(selPane);        // 연결 반영(어느 깊이든)
      await pushPane(r.target.id, selPane);             // 그 주제를 오른쪽 패널로
    });
}
document.addEventListener('mouseup', e=>{
  const pop = $('#sel-pop');
  if (e.target.closest('#sel-pop')) return;            // 팝업 안 클릭은 무시
  const sel = window.getSelection();
  const text = sel ? sel.toString().trim() : '';
  const anchorEl = sel && sel.anchorNode
    ? (sel.anchorNode.nodeType===3 ? sel.anchorNode.parentElement : sel.anchorNode) : null;
  const pane = anchorEl ? anchorEl.closest('.pane') : null;
  // 답 본문 또는 스레드 가지 본문에서 고른 텍스트만 — 어느 깊이서나 동작
  if (!text || !pane || !anchorEl.closest('.answer, .body')){ pop.style.display='none'; return; }
  const host = anchorEl.closest('[data-node-id]');     // 스레드 가지 or 패널 루트
  selPane = pane; selNodeId = host ? host.dataset.nodeId : pane.dataset.nodeId; selText = text;
  const r = sel.getRangeAt(0).getBoundingClientRect();
  pop.style.left = r.left + 'px'; pop.style.top = (r.bottom + 6) + 'px';   // #sel-pop=fixed
  $('#sel-q').value = text;
  $('#sel-src').textContent = `선택: "${text.slice(0,40)}${text.length>40?'…':''}"`;
  $('#sel-exist').innerHTML = ''; $('#sel-hint').textContent = '';
  pop.style.display = 'block';
  // "이미 정리된 게 있나" 존재 확인 → 있으면 '바로 열기'(읽기) 지름길(노트 08)
  api('POST','/api/classify',{span:text}).then(r=>{
    if (selText !== text || pop.style.display==='none') return;   // 선택 바뀌면 무시
    if (r.existing){
      $('#sel-exist').innerHTML =
        `<div class="prov">이미 정리됨: <a class="ol" id="sel-open">${esc(r.existing.title)}</a> — 읽거나, 더 물어보세요</div>`;
      $('#sel-open').onclick = ()=>{ $('#sel-pop').style.display='none'; pushPane(r.existing.id, selPane); };
    } else {
      $('#sel-hint').textContent = '새 주제 — 물으면 AI가 정리합니다';
    }
  }).catch(()=>{});
});
$('#sel-close').onclick = ()=> $('#sel-pop').style.display='none';
// 묻고 열기 — 그 주제를 우측 패널로(있으면 연결, 없으면 AI 정리). 단일 경로.
$('#sel-ask').onclick = ()=>{
  const q = $('#sel-q').value.trim() || selText;
  if (!q || !selNodeId || !selPane || !selPane.isConnected) return;
  pointOpen(q).catch(e=> alert('실패: ' + e.message));
};
$('#sel-q').addEventListener('keydown', e=>{
  if (e.key==='Enter'){ e.preventDefault(); $('#sel-ask').click(); }
});

// -- wiring ------------------------------------------------------------------
$('#btn-search').onclick = doSearch;
$('#btn-ask').onclick = ()=> doAsk();
$('#search').addEventListener('keydown', e=>{
  if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); doSearch(); }
});
$('#new-query').onclick = ()=> {
  const f = $('#query-form'); f.style.display = f.style.display==='none'?'block':'none';
};
$('#q-post').onclick = async ()=>{
  const r = await api('POST','/api/queries',
    {title:$('#q-title').value, detail:$('#q-detail').value, author:me(), space:space()});
  $('#q-title').value=''; $('#q-detail').value=''; $('#query-form').style.display='none';
  await refreshStat(); loadQueries(); renderNode(r);
};
$('#btn-mint').onclick = async ()=>{
  await api('POST','/api/mint',{account:me(), amount:Number($('#mint-amt').value)});
  loadLedger();
};
$('#btn-reset').onclick = async ()=>{
  if (!confirm('모든 노드·평가·포인트를 삭제합니다. 되돌릴 수 없습니다. 진행할까요?')) return;
  try {
    await withBusy('전체 삭제 중…',
      ()=> api('POST','/api/admin/reset?confirm=DELETE-ALL'), $('#btn-reset'));
    panes().innerHTML = '<div class="empty">전체 삭제됨. 새 질문을 시작하세요.</div>'; trail = [];
    await refreshStat(); reloadAll();
  } catch(e){ alert('삭제 실패: ' + e.message); }
};
$('#add-space').onclick = ()=>{
  const v = $('#space-new').value.trim(); if(!v) return;
  if (![...$('#space').options].some(o=>o.value===v)){
    const o = document.createElement('option'); o.value=o.textContent=v;
    $('#space').appendChild(o);
  }
  $('#space').value = v; $('#space-new').value=''; onSpaceChange();
};
$('#space').onchange = onSpaceChange;

function onSpaceChange(){           // 레이어 바뀌면 좌·우뿐 아니라 *열린 패널*도 갱신
  reloadAll();
  refreshAllPanes();
  updateLayerHint();
}
function updateLayerHint(){
  const sp = space();
  $('#layer-hint').textContent = sp==='public' ? '' : `· ${sp} 오버레이로 보는 중`;
}
function reloadAll(){ doSearch(); loadQueries(); loadScores(); loadLedger(); loadTree(); }
$('#tree-refresh').onclick = loadTree;
(async function init(){
  await refreshStat(); reloadAll(); updateLayerHint();
})();
</script>
</body>
</html>
